<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionysus — Celeste's Descent · full-journey prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #0d0c0a;
    --paper: #f4efe6;
    --ink: #16140f;
    --ash: rgba(222, 213, 196, 0.92);
    --amber: #e8702a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; letter-spacing: -0.02em; }
  body { background: var(--dark); cursor: none; transition: background 0.8s ease; }
  body.light { background: var(--paper); }

  /* layers */
  #bgCanvas  { position: fixed; inset: 0; z-index: 1; }          /* marbling / hidden art */
  #fxCanvas  { position: fixed; inset: 0; z-index: 2; }          /* spotlight mask, stir, blooms */
  #washOverlay { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse 70% 62% at 50% 46%, rgba(22,20,15,0) 30%, rgba(22,20,15,0.5) 100%);
    opacity: 0; transition: opacity 1.2s ease; }
  #app       { position: fixed; inset: 0; z-index: 10; }
  #floodCanvas { position: fixed; inset: 0; z-index: 200; pointer-events: none; opacity: 0; }
  #cursorDot { position: fixed; width: 6px; height: 6px; border-radius: 50%; z-index: 300; pointer-events: none;
    background: rgba(244,239,230,0.9); box-shadow: 0 0 14px 3px rgba(244,239,230,0.3); }
  body.light #cursorDot { background: rgba(22,20,15,0.75); box-shadow: 0 0 10px 1px rgba(22,20,15,0.15); }

  /* nav */
  nav { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 0.5rem;
    padding: 1.4rem 1.5rem; z-index: 100; pointer-events: none; color: #fff; transition: color 0.8s ease; }
  body.light nav { color: var(--ink); }
  nav .wordmark { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; letter-spacing: 0.1em; }

  /* sediment memory glass */
  #sediment { position: fixed; left: 1.6rem; bottom: 1.6rem; z-index: 100; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
  #sediment.on { opacity: 0.9; }

  /* stage scaffolding */
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 0 1.5rem; }
  .rise { opacity: 0; transform: translateY(14px); animation: rise 0.9s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: 0.45em; color: rgba(222,213,196,0.45); }
  body.light .kicker { color: rgba(22,20,15,0.42); }
  .serif { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; }
  h1.q { margin-top: 0.9rem; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: clamp(1.7rem, 3.6vw, 2.7rem); line-height: 1.2; color: var(--ash); text-wrap: balance; max-width: 22ch; }
  body.light h1.q { color: var(--ink); }
  .sub { margin-top: 0.9rem; max-width: 26rem; font-weight: 300; font-size: clamp(0.83rem, 1vw, 0.95rem);
    line-height: 1.65; color: rgba(222,213,196,0.55); }
  body.light .sub { color: rgba(22,20,15,0.55); }
  .whisper { font-size: 0.72rem; font-weight: 300; letter-spacing: 0.2em; text-transform: lowercase; color: rgba(222,213,196,0.32); }
  body.light .whisper { color: rgba(22,20,15,0.35); }

  .btn { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 0.875rem; letter-spacing: 0.08em;
    border-radius: 999px; padding: 0.85rem 2.1rem; cursor: none; transition: all 0.45s ease; }
  .btn-dark { color: var(--ash); background: rgba(222,213,196,0.07); border: 1px solid rgba(222,213,196,0.35); }
  .btn-dark:hover:not(:disabled) { letter-spacing: 0.12em; background: rgba(222,213,196,0.14); }
  body.light .btn-dark { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  body.light .btn-dark:hover:not(:disabled) { letter-spacing: 0.12em; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.22; }
  .ghost { background: none; border: none; cursor: none; font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 0.78rem; letter-spacing: 0.14em; color: rgba(22,20,15,0.38); transition: color 0.4s ease; }
  .ghost:hover { color: rgba(22,20,15,0.7); }

  input.inscribe { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.25rem; text-align: center;
    color: var(--ash); background: transparent; border: none; border-bottom: 1px solid rgba(222,213,196,0.3);
    outline: none; padding: 0.5rem 0.25rem; width: min(19rem, 80vw); caret-color: rgba(222,213,196,0.6); cursor: none; }
  input.inscribe::placeholder { color: rgba(222,213,196,0.26); }

  /* hero */
  .hero-left { position: absolute; left: 7vw; top: 50%; transform: translateY(-50%); text-align: left; max-width: 24rem; }
  .hero-kicker { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.3rem, 2.2vw, 1.9rem); color: var(--amber); }
  .hero-title { font-family: 'Inter', sans-serif; font-weight: 500; letter-spacing: -0.04em;
    font-size: clamp(2.4rem, 5.4vw, 4.2rem); color: #fff; line-height: 1.05; margin-top: 0.3rem; }
  .hero-body { margin-top: 1.2rem; font-weight: 300; font-size: 0.95rem; line-height: 1.65; color: rgba(255,255,255,0.55); }
  .hero-right { position: absolute; right: 7vw; bottom: 10vh; text-align: right; max-width: 22rem; }
  .hero-right .lead-in { font-weight: 300; font-size: 0.9rem; line-height: 1.6; color: rgba(255,255,255,0.55); margin-bottom: 1.2rem; }
  .side-door { position: absolute; right: 7vw; bottom: 3.4vh; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 0.92rem; color: rgba(222,213,196,0.34); transition: color 0.5s ease; cursor: none; }
  .side-door:hover { color: rgba(222,213,196,0.6); }

  /* choice cards (Ch I scenes) */
  .scene-row { display: flex; gap: 1.1rem; margin-top: 2.2rem; flex-wrap: wrap; justify-content: center; }
  .scene-card { width: clamp(120px, 16vw, 190px); height: clamp(160px, 22vw, 250px); border-radius: 4px;
    position: relative; overflow: hidden; cursor: none; transition: transform 0.5s ease, box-shadow 0.5s ease, opacity 0.5s ease;
    box-shadow: 0 6px 30px rgba(22,20,15,0.18); }
  .scene-card:hover { transform: translateY(-6px); }
  .scene-card.dim { opacity: 0.3; }
  .scene-card.chosen { transform: scale(1.05); box-shadow: 0 10px 44px rgba(22,20,15,0.3); }
  .scene-card .nm { position: absolute; left: 0; right: 0; bottom: 0.8rem; font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 0.95rem; color: rgba(244,239,230,0.92); text-shadow: 0 1px 6px rgba(0,0,0,0.4); }

  /* color ring */
  .ring-wrap { position: relative; width: 280px; height: 280px; margin-top: 1.6rem; }
  .ring-dot { position: absolute; width: 34px; height: 34px; border-radius: 50%; transform: translate(-50%, -50%);
    cursor: none; transition: transform 0.4s ease, box-shadow 0.4s ease; }
  .ring-dot:hover { transform: translate(-50%, -50%) scale(1.3); }
  .ring-dot.chosen { transform: translate(-50%, -50%) scale(1.5); box-shadow: 0 0 0 5px rgba(22,20,15,0.12), 0 4px 18px rgba(22,20,15,0.3); }

  /* stir (Ch II) */
  .stir-words { display: flex; justify-content: space-between; width: min(620px, 84vw); margin-top: 1rem;
    font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1rem, 1.6vw, 1.3rem); color: rgba(22,20,15,0.7); }
  .stir-box { position: relative; width: min(620px, 84vw); height: 200px; margin-top: 0.8rem; border-radius: 6px;
    overflow: hidden; cursor: none; box-shadow: inset 0 0 0 1px rgba(22,20,15,0.12), 0 10px 36px rgba(22,20,15,0.12); }
  .stir-box canvas { width: 100%; height: 100%; display: block; }

  /* flick (Ch III) */
  .flick-zone { display: flex; gap: 4vw; margin-top: 2rem; }
  .flick-side { width: clamp(140px, 18vw, 220px); padding: 2.2rem 1rem; border-radius: 6px; cursor: none;
    border: 1px solid rgba(22,20,15,0.14); font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(1.15rem, 1.9vw, 1.5rem); color: rgba(22,20,15,0.75); transition: all 0.3s ease; background: rgba(244,239,230,0.5); }
  .flick-side:hover { border-color: rgba(22,20,15,0.5); transform: translateY(-3px); background: rgba(244,239,230,0.9); }

  /* word shower (Ch IV) */
  .shower-field { position: relative; width: 100%; height: 52vh; margin-top: 0.6rem; overflow: hidden; }
  .w-drop { position: absolute; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(1rem, 1.7vw, 1.45rem); color: rgba(22,20,15,0.6); cursor: none; white-space: nowrap;
    transition: color 0.4s ease, text-shadow 0.4s ease, transform 0.4s ease; animation: fall linear forwards; }
  @keyframes fall { from { transform: translateY(-8vh); } to { transform: translateY(60vh); } }
  .w-drop.bloom { color: var(--seed, #e8702a); transform: scale(1.25) !important; animation-play-state: paused; text-shadow: 0 0 22px var(--seed-glow, rgba(232,112,42,0.4)); }

  /* garnish (Ch V) */
  .flavor-row { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
  .flavor { padding: 0.7rem 1.5rem; border-radius: 999px; border: 1px solid rgba(22,20,15,0.2);
    font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05rem; color: rgba(22,20,15,0.65);
    cursor: none; transition: all 0.35s ease; background: transparent; }
  .flavor:hover { border-color: rgba(22,20,15,0.5); }
  .flavor.in { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .glass-row { display: flex; gap: 3rem; margin-top: 2rem; align-items: flex-end; }
  .glass-opt { cursor: none; opacity: 0.45; transition: opacity 0.4s ease, transform 0.4s ease; }
  .glass-opt:hover { opacity: 0.8; }
  .glass-opt.chosen { opacity: 1; transform: scale(1.07); }
  .glass-opt .gl-label { margin-top: 0.6rem; font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.95rem; color: rgba(22,20,15,0.65); }
  .banish-row { display: flex; gap: 0.9rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
  .banish { position: relative; padding: 0.6rem 1.3rem; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 1rem; color: rgba(22,20,15,0.65); cursor: none; border: none; background: none; transition: color 0.3s ease; }
  .banish::after { content: ''; position: absolute; left: 8%; top: 52%; height: 2px; width: 0;
    background: #b05a64; transform: rotate(-4deg); transition: width 0.35s ease; }
  .banish.x { color: rgba(22,20,15,0.3); }
  .banish.x::after { width: 84%; }

  /* foam (Ch VI) */
  .foam-track { position: relative; width: min(480px, 80vw); height: 60px; margin-top: 2.4rem; }
  .foam-line { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(22,20,15,0.25); }
  .foam-bubble { position: absolute; top: 50%; width: 30px; height: 30px; border-radius: 50%;
    transform: translate(-50%, -50%); background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(232,224,206,0.75));
    box-shadow: 0 2px 12px rgba(22,20,15,0.18), inset 0 0 0 1px rgba(22,20,15,0.08); cursor: none; }
  .foam-ends { display: flex; justify-content: space-between; width: min(480px, 80vw); margin-top: 0.4rem;
    font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.9rem; color: rgba(22,20,15,0.45); }
  textarea.true-thing { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.15rem; line-height: 1.7;
    color: var(--ink); background: transparent; border: none; border-bottom: 1px solid rgba(22,20,15,0.25); outline: none;
    width: min(30rem, 84vw); margin-top: 2rem; resize: none; text-align: center; cursor: none; caret-color: rgba(22,20,15,0.6); }
  textarea.true-thing::placeholder { color: rgba(22,20,15,0.26); }

  /* distillation */
  .frag { margin-top: 1.6rem; min-height: 3.2em; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem); color: rgba(22,20,15,0.5); max-width: 32rem; transition: opacity 0.8s ease; }

  /* reveal */
  .reveal-name { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600;
    font-size: clamp(2.6rem, 6.4vw, 5rem); color: var(--ink); line-height: 1.1;
    background: linear-gradient(90deg, var(--ink) 50%, rgba(22,20,15,0.06) 50%); background-size: 200% 100%;
    background-position: 100% 0; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: paint 2.6s cubic-bezier(0.5, 0, 0.3, 1) 0.8s forwards; }
  @keyframes paint { to { background-position: 0 0; } }
  .narrative { margin-top: 1.8rem; max-width: 34rem; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(0.98rem, 1.5vw, 1.2rem); line-height: 1.9; color: rgba(22,20,15,0.72); }

  /* recipe card */
  .card { margin-top: 1.2rem; background: #faf6ec; border: 1px solid rgba(22,20,15,0.14); border-radius: 4px;
    padding: 2.4rem 2.8rem; max-width: 25rem; width: 90vw; box-shadow: 0 16px 60px rgba(22,20,15,0.16); text-align: left; }
  .card .c-name { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 1.7rem; color: var(--ink); }
  .card .c-for { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(22,20,15,0.4); margin-top: 0.3rem; }
  .card ul { list-style: none; margin-top: 1.4rem; }
  .card li { display: flex; justify-content: space-between; gap: 1rem; font-weight: 300; font-size: 0.92rem;
    color: rgba(22,20,15,0.75); padding: 0.32rem 0; border-bottom: 1px dotted rgba(22,20,15,0.18); }
  .card li span:first-child { font-family: 'Playfair Display', serif; font-style: italic; }
  .card .method { margin-top: 1.3rem; font-weight: 300; font-size: 0.85rem; line-height: 1.65; color: rgba(22,20,15,0.55); }
  .card .seal { width: 22px; height: 22px; border-radius: 50%; margin-top: 1.5rem; opacity: 0.85; }

  .toast { position: fixed; right: 6vw; bottom: 12vh; max-width: 30ch; font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 0.95rem; color: rgba(222,213,196,0.7); opacity: 0; transition: opacity 1s ease;
    pointer-events: none; text-align: right; z-index: 150; }
  .toast.on { opacity: 1; }

  @media (max-width: 700px) {
    .hero-left { left: 6vw; right: 6vw; max-width: none; top: 38%; }
    .hero-right { right: 6vw; bottom: 16vh; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>
<div id="washOverlay"></div>

<nav>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
    <path d="M 10 22 C 10 18, 9 16, 8 15 L 5.5 14 L 6.5 12.5 L 4.5 10 L 6.5 8 C 6.5 6, 7 4, 11 2.5 C 16 1, 19 6, 18 13 C 17.5 17, 16 20, 15 22 C 15 22, 14 20, 14 18 H 9 L 11.5 17 V 12 C 8 12, 7 10, 7 7 H 16 C 16 10, 15 12, 11.5 12 V 17 L 14 18" />
    <circle cx="11.5" cy="4.5" r="1.5" fill="currentColor" stroke="none" />
  </svg>
  <span class="wordmark">Dionysus</span>
</nav>

<canvas id="sediment" width="48" height="84"></canvas>
<div id="app"></div>
<canvas id="floodCanvas"></canvas>
<div class="toast" id="toast"></div>
<div id="cursorDot"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   DIONYSUS · Celeste's Descent — full-journey prototype
   Hero → Threshold → Six Chapters → Distillation → Reveal → Recipe
   Everything decided so far, assembled to feel the rhythm.
   ═══════════════════════════════════════════════════════════════ */

const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
let W = innerWidth, H = innerHeight;
const INK = '#16140f', PAPER = '#f4efe6', DARK = '#0d0c0a';

/* ── session state ─────────────────────────────────────────── */
const S = {
  name: '', scene: null, seed: '#e8702a',
  pol: {}, flick: {}, words: [], flavors: [],
  glass: null, banished: [], familiarity: 0.5, trueThing: '',
  flickSpeeds: [], strata: []
};

/* ── canvases ──────────────────────────────────────────────── */
const bg = document.getElementById('bgCanvas'), bgx = bg.getContext('2d');
const fx = document.getElementById('fxCanvas'), fxx = fx.getContext('2d');
function sizeAll() {
  W = innerWidth; H = innerHeight;
  for (const [c, x] of [[bg, bgx], [fx, fxx]]) {
    c.width = W * DPR; c.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
sizeAll();
addEventListener('resize', () => { sizeAll(); stages[idx].bgPaint && stages[idx].bgPaint(); });

/* ── cursor dot ────────────────────────────────────────────── */
const dot = document.getElementById('cursorDot');
const mouse = { x: W / 2, y: H / 2 };
const sm = { x: W / 2, y: H / 2 };
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
(function moveDot() {
  sm.x += (mouse.x - sm.x) * 0.22; sm.y += (mouse.y - sm.y) * 0.22;
  dot.style.left = (sm.x - 3) + 'px'; dot.style.top = (sm.y - 3) + 'px';
  requestAnimationFrame(moveDot);
})();

/* ── ink flood (the build's page turn) ─────────────────────── */
const flood = document.getElementById('floodCanvas'), flx = flood.getContext('2d');
let floodBusy = false;
function runFlood(onCovered) {
  if (floodBusy) return;
  floodBusy = true;
  flood.width = W * DPR; flood.height = H * DPR; flx.setTransform(DPR, 0, 0, DPR, 0, 0);
  flood.style.opacity = '1';
  const COVER = 620, HOLD = 140, RECEDE = 540;
  const maxR = Math.hypot(W, H) * 0.75;
  const blobs = [
    { cx: W * .5, cy: H * .45, p1: Math.random() * 7, p2: Math.random() * 7, a1: .16, a2: .1, s: 1 },
    { cx: W * .2, cy: H * .8, p1: Math.random() * 7, p2: Math.random() * 7, a1: .2, a2: .12, s: .55 },
    { cx: W * .85, cy: H * .15, p1: Math.random() * 7, p2: Math.random() * 7, a1: .2, a2: .12, s: .5 }];
  const draw = r => {
    flx.clearRect(0, 0, W, H); flx.fillStyle = INK;
    for (const b of blobs) {
      flx.beginPath();
      for (let i = 0; i <= 90; i++) {
        const a = i / 90 * Math.PI * 2;
        const wob = 1 + b.a1 * Math.sin(5 * a + b.p1) + b.a2 * Math.sin(9 * a + b.p2);
        const x = b.cx + Math.cos(a) * r * b.s * wob, y = b.cy + Math.sin(a) * r * b.s * wob;
        i === 0 ? flx.moveTo(x, y) : flx.lineTo(x, y);
      }
      flx.closePath(); flx.fill();
    }
  };
  const eIn = t => t * t * t * t, eOut = t => 1 - Math.pow(1 - t, 4);
  const start = performance.now(); let covered = false;
  (function tick(now) {
    const t = now - start;
    if (t < COVER) draw(maxR * eIn(t / COVER));
    else if (t < COVER + HOLD) { if (!covered) { covered = true; flx.fillStyle = INK; flx.fillRect(0, 0, W, H); onCovered(); } }
    else if (t < COVER + HOLD + RECEDE) flood.style.opacity = String(1 - eOut((t - COVER - HOLD) / RECEDE));
    else { flx.clearRect(0, 0, W, H); flood.style.opacity = '0'; floodBusy = false; return; }
    requestAnimationFrame(tick);
  })(start);
}

/* ── sediment memory glass ─────────────────────────────────── */
const sed = document.getElementById('sediment'), sedx = sed.getContext('2d');
function addStratum(color) {
  S.strata.push(color);
  drawSediment();
}
function drawSediment() {
  sedx.clearRect(0, 0, 48, 84);
  sedx.strokeStyle = document.body.classList.contains('light') ? 'rgba(22,20,15,0.45)' : 'rgba(222,213,196,0.5)';
  sedx.lineWidth = 1.2;
  sedx.beginPath();
  sedx.moveTo(8, 6); sedx.bezierCurveTo(8, 38, 16, 50, 24, 50);
  sedx.bezierCurveTo(32, 50, 40, 38, 40, 6);
  sedx.moveTo(24, 50); sedx.lineTo(24, 72);
  sedx.moveTo(13, 78); sedx.quadraticCurveTo(24, 72, 35, 78);
  sedx.stroke();
  const n = S.strata.length;
  if (!n) return;
  const top = 12, bottom = 47;
  const hEach = Math.min((bottom - top) / Math.max(n, 8), 5);
  S.strata.forEach((c, i) => {
    const y = bottom - (i + 1) * hEach;
    sedx.fillStyle = c; sedx.globalAlpha = 0.8;
    const wHalf = 13 - Math.max(0, (y - 28)) * 0.18;
    sedx.fillRect(24 - wHalf, y, wHalf * 2, hEach - 0.6);
  });
  sedx.globalAlpha = 1;
}

/* ── ink wash level (progress = removal) ───────────────────── */
function setWash(level) { /* 1 = heaviest, 0 = clear */
  document.getElementById('washOverlay').style.opacity = String(level * 0.85);
}

/* ── light-world marbling backdrop (static per stage) ──────── */
function paintMarbling(density) {
  bgx.fillStyle = PAPER; bgx.fillRect(0, 0, W, H);
  const drops = [];
  const palette = [INK, '#3c3a33', PAPER, S.seed, PAPER, '#2a2720'];
  const POINTS = 70;
  const count = Math.round(10 + density * 30);
  for (let k = 0; k < count; k++) {
    const cx = W * Math.random(), cy = H * Math.random(), r = 26 + Math.random() * 80;
    for (const d of drops) for (let i = 0; i < POINTS; i++) {
      const dx = d.xs[i] - cx, dy = d.ys[i] - cy, dist2 = dx * dx + dy * dy || 1e-4;
      const f = Math.sqrt(1 + r * r / dist2);
      d.xs[i] = cx + dx * f; d.ys[i] = cy + dy * f;
    }
    const xs = new Float32Array(POINTS), ys = new Float32Array(POINTS);
    for (let i = 0; i < POINTS; i++) {
      const a = i / POINTS * Math.PI * 2;
      xs[i] = cx + Math.cos(a) * r; ys[i] = cy + Math.sin(a) * r;
    }
    drops.push({ xs, ys, color: palette[k % palette.length] });
  }
  bgx.globalAlpha = 0.10 + density * 0.25;
  for (const d of drops) {
    bgx.fillStyle = d.color;
    bgx.beginPath(); bgx.moveTo(d.xs[0], d.ys[0]);
    for (let i = 1; i < POINTS; i++) bgx.lineTo(d.xs[i], d.ys[i]);
    bgx.closePath(); bgx.fill();
  }
  bgx.globalAlpha = 1;
}

      }
      cx2.lineTo(0, bh); cx2.closePath(); cx2.fill();
      /* right ink */
      cx2.fillStyle = colR;
      cx2.beginPath(); cx2.moveTo(bw, 0);
      for (let y = 0; y <= bh; y += 6) {
        const wob = Math.sin(y * 0.045 + t * 0.0016) * 14 + Math.sin(y * 0.012 - t * 0.0009) * 22;
        cx2.lineTo(bx + wob + 10 + Math.sin(y * 0.09 + t * 0.002) * 8, y);
      }
      cx2.lineTo(bw, bh); cx2.closePath(); cx2.fill();
      cx2.globalAlpha = 1;
      fxLoop = requestAnimationFrame(loop);
    };
    loop(performance.now());
    document.getElementById('commitStir').onclick = () => {
      const [l, r, colL, colR] = POLS[qi];
      S.pol[l + '–' + r] = v;
      addStratum(v < 0.5 ? colL : colR);
      qi++;
      if (qi < POLS.length) {
        setQ();
      } else { stopFx(); next(); }
    };
  }
},

/* ---------- 5 · CHAPTER III — bitters flicks ×4 ---------- */
{
  name: 'ch3', light: true, sediment: true, wash: 0.6, marble: 0.5,
  render() {
    const PAIRS = [['Day', 'Night'], ['Loner', 'Social'], ['In control', 'Out of control'], ['Quiet', 'Loud']];
    let qi = 0, shownAt = performance.now();
    app.appendChild(el(`<div class="stage">
      <p class="kicker rise">Chapter Three · Bitters</p>
      <h1 class="q rise" id="ch3q" style="animation-delay:120ms">Quick — cast the droplet. Don't think.</h1>
      <div class="flick-zone rise" style="animation-delay:240ms">
        <div class="flick-side" id="fL"></div>
        <div class="flick-side" id="fR"></div>
      </div>
    </div>`));
    const L = document.getElementById('fL'), R = document.getElementById('fR');
    function setQ() { L.textContent = PAIRS[qi][0]; R.textContent = PAIRS[qi][1]; shownAt = performance.now(); }
    setQ();
    function cast(side, elx) {
      S.flickSpeeds.push(performance.now() - shownAt);
      S.flick[PAIRS[qi].join('–')] = side;
      addStratum(side === 0 ? '#8a6a4a' : '#56586b');
      /* droplet flies */
      const r = elx.getBoundingClientRect();
      const sx = side === 0 ? r.right : r.left, sy = r.top + r.height / 2;
      const tx = side === 0 ? r.left - 80 : r.right + 80;
      const t0 = performance.now();
      const fly = now => {
        const p = Math.min((now - t0) / 260, 1);
        fxx.clearRect(0, 0, W, H);
        fxx.fillStyle = '#b05a64'; fxx.globalAlpha = 1 - p * 0.4;
        fxx.beginPath(); fxx.arc(sx + (tx - sx) * p, sy - Math.sin(p * Math.PI) * 46, 5 - p * 2, 0, 7); fxx.fill();
        fxx.globalAlpha = 1;
        if (p < 1) requestAnimationFrame(fly); else fxx.clearRect(0, 0, W, H);
      };
      requestAnimationFrame(fly);
      qi++;
      if (qi < PAIRS.length) setTimeout(setQ, 240);
      else setTimeout(next, 420);
    }
    L.onclick = () => cast(0, L);
    R.onclick = () => cast(1, R);
  }
},

/* ---------- 6 · CHAPTER IV — word-droplet shower ---------- */
{
  name: 'ch4', light: true, sediment: true, wash: 0.42, marble: 0.35,
  render() {
    const WORDS = ['velvet', 'thunder', 'dusk', 'neon', 'ember', 'silk', 'static', 'moss', 'chrome', 'honey', 'smoke', 'tide'];
    app.appendChild(el(`<div class="stage" style="justify-content:flex-start;padding-top:14vh">
      <p class="kicker rise">Chapter Four · Citrus</p>
      <h1 class="q rise" style="animation-delay:120ms">Catch what resonates. Let the rest dissolve.</h1>
      <div class="shower-field rise" id="field" style="animation-delay:260ms"></div>
      <div style="position:fixed;bottom:7vh"><button class="btn btn-dark" id="ch4go" disabled>These are mine</button></div>
    </div>`));
    const field = document.getElementById('field');
    const goBtn = document.getElementById('ch4go');
    let launched = 0;
    const launch = () => {
      if (idx !== 6 || launched >= 26) return;
      const w = WORDS[launched % WORDS.length];
      const d = el(`<span class="w-drop" style="left:${6 + Math.random() * 84}%;animation-duration:${7 + Math.random() * 5}s">${w}</span>`);
      d.onclick = () => {
        if (d.classList.contains('bloom')) return;
        d.classList.add('bloom');
        if (!S.words.includes(w)) S.words.push(w);
        addStratum(S.seed);
        if (S.words.length >= 3) goBtn.disabled = false;
      };
      d.addEventListener('animationend', () => !d.classList.contains('bloom') && d.remove());
      field.appendChild(d);
      launched++;
      setTimeout(launch, 700 + Math.random() * 500);
    };
    setTimeout(launch, 600);
    goBtn.onclick = next;
  }
},

/* ---------- 7 · CHAPTER V — garnish ---------- */
{
  name: 'ch5', light: true, sediment: true, wash: 0.26, marble: 0.22,
  render() {
    app.appendChild(el(`<div class="stage">
      <p class="kicker rise">Chapter Five · Garnish</p>
      <h1 class="q rise" style="animation-delay:120ms">Flick into the glass what belongs there.</h1>
      <div class="flavor-row rise" id="flav" style="animation-delay:240ms"></div>
      <h1 class="q rise" style="font-size:clamp(1.1rem,2vw,1.5rem);margin-top:2.6rem;animation-delay:360ms">And how does it sit in the hand?</h1>
      <div class="glass-row rise" id="glassRow" style="animation-delay:460ms"></div>

    </div>`));

    ['sweet', 'bitter', 'spicy', 'herbal', 'citrusy'].forEach(f => {
      const b = el(`<button class="flavor">${f}</button>`);
      b.onclick = () => {
        b.classList.toggle('in');

    const mk = (id, label, svg) => {

      g.onclick = () => {
        S.glass = id;
        [...glassRow.children].forEach(x => x.classList.remove('chosen'));
        g.classList.add('chosen');
        check();
      };
      glassRow.appendChild(g);
    };
    const stroke = 'stroke="rgba(22,20,15,0.7)" stroke-width="1.5" fill="none" stroke-linecap="round"';
    mk('rocks', 'short & strong', `<svg width="64" height="76" viewBox="0 0 64 76"><path ${stroke} d="M14 18 L17 62 Q32 68 47 62 L50 18 M14 18 Q32 24 50 18"/></svg>`);
    mk('coupe', 'poised & ceremonial', `<svg width="64" height="76" viewBox="0 0 64 76"><path ${stroke} d="M12 12 C12 32 24 38 32 38 C40 38 52 32 52 12 M12 12 Q32 18 52 12 M32 38 L32 62 M18 68 Q32 62 46 68"/></svg>`);
    mk('highball', 'tall & cold', `<svg width="64" height="76" viewBox="0 0 64 76"><path ${stroke} d="M20 8 L22 66 Q32 71 42 66 L44 8 M20 8 Q32 13 44 8"/></svg>`);
    const check = () => document.getElementById('ch5go').disabled = !(S.flavors.length && S.glass);
    document.getElementById('ch5go').onclick = next;
  }
},

/* ---------- 8 · CHAPTER V — banishing ritual ---------- */
{
  name: 'ch5b', light: true, sediment: true, wash: 0.18, marble: 0.16,
  render() {
    app.appendChild(el(`<div class="stage">

      b.onclick = () => {
        b.classList.toggle('x');

/* ---------- 9 · CHAPTER VI — foam & one true thing ---------- */
{
  name: 'ch6', light: true, sediment: true, wash: 0.08, marble: 0.08,
  render() {
    app.appendChild(el(`<div class="stage">
      <p class="kicker rise">Chapter Six · Foam</p>
      <h1 class="q rise" style="animation-delay:140ms">How well do you know the night's craft?</h1>
      <div class="foam-track rise" id="track" style="animation-delay:280ms">
        <div class="foam-line"></div>
        <div class="foam-bubble" id="bub" style="left:50%"></div>
      </div>
      <div class="foam-ends rise" style="animation-delay:320ms"><span>a curious stranger</span><span>an old friend</span></div>
      <h1 class="q rise" style="font-size:clamp(1.1rem,2vw,1.5rem);margin-top:3.2rem;animation-delay:480ms">Tell the alchemist one true thing.</h1>
      <textarea class="true-thing rise" id="tt" rows="2" placeholder="…or let the foam settle" style="animation-delay:600ms"></textarea>
      <div style="margin-top:2.2rem"><button class="btn btn-dark" id="ch6go">Let it settle</button></div>
    </div>`));
    const track = document.getElementById('track'), bub = document.getElementById('bub');
    let drag = false;
    track.addEventListener('pointerdown', e => { drag = true; track.setPointerCapture(e.pointerId); movB(e); });
    track.addEventListener('pointermove', e => drag && movB(e));
    track.addEventListener('pointerup', () => drag = false);
    function movB(e) {
      const r = track.getBoundingClientRect();
      S.familiarity = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      bub.style.left = (S.familiarity * 100) + '%';
    }
    document.getElementById('ch6go').onclick = () => {
      S.trueThing = document.getElementById('tt').value.trim();
      addStratum('#ece5d2');
      next();
    };
  }
},

/* ---------- 10 · THE DISTILLATION ---------- */
{
  name: 'distill', light: true, sediment: true, wash: 0, marble: 0.04,
  render() {
    app.appendChild(el(`<div class="stage">
      <p class="kicker rise">The Distillation</p>
      <h1 class="q rise" style="animation-delay:140ms">Distilling your essence…</h1>
      <div class="frag rise" id="frag" style="animation-delay:300ms"></div>
    </div>`));
    /* breathing blot */
    const t0 = performance.now();
    const loop = now => {
      const t = (now - t0) / 1000;
      fxx.clearRect(0, 0, W, H);
      const r = 60 + Math.sin(t * 1.4) * 14;
      const g = fxx.createRadialGradient(W / 2, H * 0.68, 0, W / 2, H * 0.68, r);
      g.addColorStop(0, 'rgba(22,20,15,0.5)'); g.addColorStop(1, 'rgba(22,20,15,0)');
      fxx.fillStyle = g;
      fxx.beginPath(); fxx.arc(W / 2, H * 0.68, r, 0, 7); fxx.fill();
      fxLoop = requestAnimationFrame(loop);
    };
    loop(t0);
    const frags = [
      'The Historian leafs through 1806 — the first “cock-tail” ever inked: spirit, sugar, water, bitters.',
      `The Alchemist weighs your ${S.words[0] || 'velvet'} against your ${S.words[1] || 'thunder'}.`,
      'Names are never invented. They are uncovered.',
    ];
    let fi = 0;
    const fr = document.getElementById('frag');
    const cycle = () => {
      if (idx !== 10) return;
      fr.style.opacity = '0';
      setTimeout(() => { fr.textContent = frags[fi % frags.length]; fr.style.opacity = '1'; fi++; }, 500);
    };
    cycle(); const iv = setInterval(cycle, 2100);
    setTimeout(() => { clearInterval(iv); stopFx(); next(); }, 6800);
  }
},

/* ---------- 11 · THE OVERFLOW REVEAL ---------- */
{
  name: 'reveal', light: true, sediment: true, wash: 0, marble: 0,
  render() {
    const R = craft();
    app.appendChild(el(`<div class="stage">
      <p class="kicker rise" style="animation-delay:1400ms">For ${S.name} — and no one else</p>
      <div class="reveal-name">${R.name}</div>
      <p class="narrative rise" style="animation-delay:2600ms">${R.narrative}</p>
      <div class="rise" style="margin-top:2.4rem;animation-delay:3400ms">
        <button class="btn btn-dark" id="toCard">Preserve this recipe</button>
      </div>
    </div>`));
    /* the sediment liquid overflows — her strata spill across the paper */
    const t0 = performance.now();
    const blobs = S.strata.slice(-8).map((c, i) => ({
      c, ang: i / 8 * Math.PI * 2 + Math.random(), sp: 0.55 + Math.random() * 0.5, r0: 16 + Math.random() * 22
    }));
    const loop = now => {
      const t = Math.min((now - t0) / 2400, 1);
      const e = 1 - Math.pow(1 - t, 3);
      fxx.clearRect(0, 0, W, H);
      fxx.globalAlpha = 0.16 * (1 - t * 0.5);
      for (const b of blobs) {
        const d = e * b.sp * Math.min(W, H) * 0.42;
        const x = W / 2 + Math.cos(b.ang) * d, y = H * 0.42 + Math.sin(b.ang) * d * 0.7;
        const g = fxx.createRadialGradient(x, y, 0, x, y, b.r0 + e * 130);
        g.addColorStop(0, b.c); g.addColorStop(1, b.c + '00');
        fxx.fillStyle = g;
        fxx.beginPath(); fxx.arc(x, y, b.r0 + e * 130, 0, 7); fxx.fill();
      }
      fxx.globalAlpha = 1;
      if (t < 1) fxLoop = requestAnimationFrame(loop);
    };
    loop(t0);
    document.getElementById('toCard').onclick = next;
  }
},

/* ---------- 12 · THE RECIPE CARD ---------- */
{
  name: 'recipe', light: true, sediment: false, wash: 0, marble: 0,

      <div class="kicker rise">The recipe card</div>
      <div class="card rise" style="animation-delay:200ms">

}];

/* ── the naming engine — the cocktail visibly comes from her ── */
function craft() {
  const p = (k, def = 0.5) => { const key = Object.keys(S.pol).find(x => x.includes(k)); return key ? S.pol[key] : def; };
  const dreamer = p('Dreamer') > 0.5, night = S.flick['Day–Night'] === 1;
  const caring = p('Caring') > 0.5, disruptor = p('Disruptor') > 0.5;
  const base = dreamer ? (night ? ['gin', 'a botanical gin'] : ['tequila', 'a bright blanco tequila'])
                       : (night ? ['rye', 'a brooding rye'] : ['bourbon', 'a sunlit bourbon']);
  const sceneNoun = { city: 'Boulevard', sea: 'Tide', forest: 'Hollow', plains: 'Horizon' }[S.scene?.id] || 'Hour';
  const word = (S.words[0] || 'velvet');
  const name = 'The ' + word.charAt(0).toUpperCase() + word.slice(1) + ' ' + sceneNoun;
  const ing = [[base[1], '2 oz']];
  ing.push(caring ? ['elderflower liqueur', '½ oz'] : ['amaro', '½ oz']);
  if (disruptor && !S.banished.includes('mezcal smoke')) ing.push(['mezcal, floated', '¼ oz']);
  ing.push(S.flavors.includes('citrusy') ? ['fresh lime', '¾ oz'] : ['fresh lemon', '¾ oz']);
  if (S.flavors.includes('sweet')) ing.push(['demerara', '¼ oz']);
  if (S.flavors.includes('spicy')) ing.push(['ginger, pressed', '2 coins']);
  if (S.flavors.includes('herbal')) ing.push(['basil, slapped', '3 leaves']);
  if (S.flavors.includes('bitter')) ing.push(['aromatic bitters', '2 dashes']);
  if (S.familiarity > 0.65 && !S.banished.includes('egg white')) ing.push(['silk of egg white', '1']);
  const glassNm = { rocks: 'a heavy rocks glass', coupe: 'a chilled coupe', highball: 'a tall highball' }[S.glass] || 'a chilled coupe';
  const decisive = S.flickSpeeds.length && (S.flickSpeeds.reduce((a, b) => a + b, 0) / S.flickSpeeds.length < 2600);
  const narrative =
    `You cast your droplets ${decisive ? 'before doubt could catch them' : 'the way rain decides — slowly, then all at once'}. ` +
    `Someone from ${S.scene?.nm || 'somewhere unnamed'} who reaches for <em>${word}</em> when it falls — ${base[0]} was never really a choice; it was waiting. ` +
    (S.banished.length ? `What you banished stays banished. ` : '') +
    (S.trueThing ? `And the true thing you told the alchemist — it stays between you. The bitters carry it, quietly.` : `You kept one thing back. The recipe respects that.`);
  const method = `Stir with intention over clear ice. Strain into ${glassNm}. Garnish with what the ${sceneNoun.toLowerCase()} remembers. Drink while the ink is still wet.`;
  return { name, ingredients: ing, narrative, method };
}

stages[0].bgPaint && stages[0].bgPaint();
