<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>H4 prototype v4 — read it in the middle, rise, and play</title>
<!-- v4 (2026-10-06, Robin's review of v3): the line is born in the true
     middle of the frame, with one short line under it. Both read there, then
     rise together, and the rise starts the clock. The first pair is "1" and
     "2" on the real timer: no tap needed to begin. Then Sharp / Smooth,
     and it carries on. Under the instruction, the second line fades away
     when the first real pair arrives. (v3 kept in ./v3/.)
     v3 (2026-10-06, Robin's review of v2): the dim is lighter; Tea/Coffee
     and Ready · Set · Go are gone. Two example glasses, "Word 1" and "Word 2",
     sit where every pair will sit while she reads the line — the whole
     mechanic in one look. Touching one shows what a catch does and starts the
     game; if she just reads, it starts by itself. The line rising to the head
     IS the start; the first real pair condenses where the examples were.
     (v2 kept in ./v2/ for comparison.)
     v2 (2026-10-06, Robin's review of v1):
       · no "Try one first" — the hold never asks for a click that isn't a choice
       · the instruction is born in the centre of the frame, then rises to the
         head and stays there as the question for all nine
       · Tea / Coffee condense straight after, a live rehearsal with no label
       · Ready · Set · Go is a breath, not a countdown: small italic words,
         opacity only, while the two empty glasses gather themselves
     The centred line sits on the cream smoke, so the whole frame dims while
     she reads it (the H5 nightfall grammar — the world dims, nothing sits
     behind the words) and lifts back most of the way as the line rises.
     Options: ?seed=%23c8102e  ?motion=still  ?diag=1   v1: ./v1/ -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Playfair:ital,opsz,wght@0,5..1200,300..700;1,5..1200,300..700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
:root {
  --font-display: 'Playfair Display', Georgia, serif;
  --font-text: 'Playfair', 'Playfair Display', Georgia, serif;
  --legible: 0 1px 2px rgba(22, 11, 4, 0.26);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --glide: cubic-bezier(0.22, 0.61, 0.36, 1);
  --sphere-hover-rim: rgba(255, 176, 136, 0.6);
  --sphere-hover-shadow: inset 0 1px 16px rgba(255, 235, 200, 0.15), 0 0 34px -6px rgba(255, 176, 136, 0.45);
  --c: #e8702a;
  --pair-y: 50%;
  --seat: clamp(150px, 21vmin, 204px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0d0b09; overflow: hidden; }
body { font-family: var(--font-text); color: #fbf4e8; -webkit-tap-highlight-color: transparent; }
::selection { background: color-mix(in srgb, var(--c) 40%, transparent); }
.world { position: fixed; inset: 0; background: url('hold-5_7.jpg') center / cover no-repeat; }
/* the held breath: the whole frame dims, evenly — no shape, no patch */
.dusk { position: fixed; inset: 0; background: #0b0806; opacity: 0; transition: opacity 1.6s var(--glide); pointer-events: none; }
/* it follows her breath: deepest while she reads, eased as the line rises,
   held again through Ready · Set · Go, released (not to zero) on Go */
.dusk.read { opacity: 0.28; }
.dusk.play { opacity: 0.16; transition-duration: 2.4s; }
.mark { position: fixed; top: clamp(18px, 3.2vh, 30px); left: clamp(20px, 6.5vw, 104px); font-family: var(--font-display); font-style: italic; font-size: 20px; text-shadow: var(--legible); z-index: 5; }

/* THE LINE. Born at the centre, then carried up to the head, where every
   other hold keeps its question. One element the whole way: it moves, it is
   never replaced. */
.line { position: absolute; left: 50%; top: 50%; width: min(640px, 88vw); transform: translate(-50%, -50%); text-align: center; z-index: 4; pointer-events: none;
  transition: top 1.5s var(--glide), transform 1.5s var(--glide); }
.line.up { top: 12.5%; transform: translate(-50%, 0); }
.line h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(1.55rem, 3.6vmin, 2.2rem); line-height: 1.25; text-shadow: var(--legible); text-wrap: balance;
  opacity: 0; filter: blur(6px); transition: opacity 1.1s ease, filter 1.1s ease, font-size 1.5s var(--glide); }
.line.up h2 { font-size: clamp(1.4rem, 3vmin, 1.85rem); }
.line p { margin: 0.8rem 0 0; font-size: clamp(15px, 1.9vmin, 17px); line-height: 1.5; color: rgba(245, 234, 216, 0.9); text-shadow: var(--legible); text-wrap: balance;
  opacity: 0; filter: blur(4px); transition: opacity 0.9s ease, filter 0.9s ease; }
.line.in h2, .line.hint p { opacity: 1; filter: none; }
.line.up p { transition: opacity 0.6s ease, filter 0.6s ease; }
.line.up.quiet p { opacity: 0; filter: blur(4px); }

/* THE TWO GLASSES. They gather out of the liquid where the words will be and
   never move again — practice, the breath and all nine pairs use these
   positions. */
@property --rim { syntax: '<number>'; inherits: false; initial-value: 0; }
.seat { position: absolute; top: var(--pair-y); left: var(--x); width: var(--seat); aspect-ratio: 1; transform: translate(-50%, -50%) scale(0.94); border-radius: 50%;
  border: 1px solid rgba(255, 235, 200, var(--rim)); box-shadow: inset 0 1px 13px rgba(255, 235, 200, calc(var(--rim) * 0.5));
  transition: --rim 0.9s ease, transform 1.2s var(--glide), opacity 0.6s ease; z-index: 2; pointer-events: none; }
.seat.on { --rim: 0.14; transform: translate(-50%, -50%) scale(1); }
.seat.on.b1 { --rim: 0.19; } .seat.on.b2 { --rim: 0.24; } .seat.on.b3 { --rim: 0.3; }
.seat.hide { opacity: 0; }

/* the embers — the app's TWIN SPHERES rev 4, unchanged; the example's 1 and 2 read larger */
.ember { position: absolute; top: var(--pair-y); left: var(--x); transform: translate(-50%, -50%); opacity: 0; border: none; background: none; padding: 10px; cursor: pointer; z-index: 3; }
.ember[data-caught] { transition: opacity 0.5s ease; }
.sphere { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 50%; text-align: center; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.ember .sphere { width: var(--seat); padding: 0 18px; transform: translateY(calc((1 - var(--ember-glow, 1)) * 14px)) scale(var(--ember-scale, 1));
  border: 1px solid rgb(255 235 200 / calc(0.08 + var(--ember-glow, 1) * 0.2));
  background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / calc(0.16 * var(--ember-glow, 1))) 0%, rgb(255 255 255 / calc(0.04 * var(--ember-glow, 1))) 42%, rgb(255 235 200 / calc(0.08 * var(--ember-glow, 1))) 100%);
  box-shadow: inset 0 1px 13px rgb(255 235 200 / calc(0.1 * var(--ember-glow, 1))), 0 0 22px -8px rgb(255 176 136 / calc(0.3 * var(--ember-glow, 1))); }
.sphere-word { position: relative; font-family: var(--font-display); font-style: italic; font-weight: 500; color: #fbf4e8; text-shadow: var(--legible); text-wrap: balance; }
.ember .sphere-word { font-size: clamp(1.35rem, 3vmin, 1.95rem); line-height: 1.1; opacity: calc(0.6 + var(--ember-glow, 1) * 0.4); filter: blur(calc(max(0, 0.3 - var(--ember-glow, 1)) * 10px)); }
@media (hover: hover) { .ember.is-number .sphere-word { font-size: clamp(2.3rem, 5.4vmin, 3.2rem); }
.ember:hover .sphere { border-color: var(--sphere-hover-rim); box-shadow: var(--sphere-hover-shadow); } }
.ember:focus-visible { outline: none; } .ember:focus-visible .sphere { outline: 2px solid var(--c); outline-offset: 4px; }
.ember .sphere::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 56%, color-mix(in srgb, var(--c) 72%, rgba(255, 244, 226, 0.6)) 0%, color-mix(in srgb, var(--c) 36%, transparent) 48%, transparent 74%); opacity: 0; transform: scale(0.25); pointer-events: none; }
@keyframes emberBloom { from { opacity: 0; transform: scale(0.25); } to { opacity: 1; transform: scale(1); } }
@keyframes emberRise { 0% { transform: scale(var(--ember-scale, 1)); opacity: 1; } 30% { transform: translateY(-5px) scale(1.07); opacity: 1; } 62% { opacity: 0.9; filter: blur(0.5px); } 100% { transform: translateY(-84px) scale(1.12); filter: blur(5px); opacity: 0; } }
@keyframes emberSink { from { transform: scale(var(--ember-scale, 1)); filter: blur(0); } to { transform: translateY(30px) scale(0.9); filter: blur(5px); } }
.ember.is-caught { opacity: 1 !important; pointer-events: none; }
.ember.is-caught .sphere { border-color: color-mix(in srgb, var(--c) 70%, white); box-shadow: inset 0 1px 18px rgba(255, 235, 200, 0.2), 0 0 44px -6px var(--c); animation: emberRise 1.05s cubic-bezier(0.33, 0, 0.25, 1) both; }
.ember.is-caught .sphere::before { animation: emberBloom 0.42s var(--ease) both; }
.ember.is-caught .sphere-word { color: #fffaf0; opacity: 1; filter: none; }
.ember.is-passed { pointer-events: none; transition: opacity 0.75s ease; opacity: 0 !important; }
.ember.is-passed .sphere { animation: emberSink 0.8s cubic-bezier(0.4, 0, 0.7, 1) both; }

/* READY · SET · GO — a breath. One small italic word at a time, in the space
   between the two glasses, fading in place: no scale, no travel, no ring.
   The glasses answer each word by gathering a little more light. */
.breath { position: absolute; left: 50%; top: var(--pair-y); transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
  font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(1.05rem, 2.1vmin, 1.3rem); letter-spacing: 0.02em; color: rgba(251, 244, 232, 0.9); text-shadow: var(--legible); white-space: nowrap;
  animation: breathe var(--beat) ease-in-out both; }
@keyframes breathe { 0% { opacity: 0; } 35%, 62% { opacity: 1; } 100% { opacity: 0; } }

/* Still Water only: without a clock, letting both go is a gesture */
.let-go { position: absolute; left: 0; right: 0; bottom: 12.5%; margin: 0 auto; width: fit-content; min-height: 44px; font: 400 11px 'Jost', system-ui, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(245, 234, 216, 0.8); background: none; border: 1px solid transparent; border-radius: 999px; padding: 0.66rem 1.95rem; cursor: pointer; z-index: 4; }
.let-go:hover, .let-go:focus-visible { border-color: rgba(255, 176, 136, 0.6); outline: none; }
.diag { position: fixed; right: 10px; bottom: 10px; z-index: 9; font: 11px/1.45 ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, 0.85); background: rgba(0, 0, 0, 0.6); padding: 8px 10px; border-radius: 6px; max-width: 320px; white-space: pre-wrap; display: none; pointer-events: none; }
body.show-diag .diag { display: block; }
.review { position: fixed; left: 10px; bottom: 10px; z-index: 9; font: 11px ui-monospace, Menlo, monospace; display: flex; gap: 4px; }
.review a, .review button { font: inherit; color: #fff; text-decoration: none; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 4px 7px; cursor: pointer; }

@media (max-width: 640px) {
  :root { --pair-y: 55%; --seat: clamp(124px, 37vw, 156px); }
  .ember, .seat { left: calc(50% + (var(--x) - 50%) * 1.42); }
  .ember .sphere { padding: 0 12px; }
  /* the gap between two phone-sized glasses is a thumb's width: the breath
     sits just beneath the pair instead, where the eye already is */
  .diag { top: 64px; bottom: auto; font-size: 9px; max-width: 150px; opacity: 0.8; }
}
@media (prefers-reduced-motion: reduce) { .line, .line h2 { transition-duration: 0.3s; } }
</style>
</head>
<body>
<div class="world" aria-hidden="true"></div>
<div class="dusk" id="dusk" aria-hidden="true"></div>
<div class="mark">Dionysus</div>
<main id="stage" aria-live="polite">
  <div class="line" id="line"><h2>Tap the word that is more you.</h2><p id="hint"></p></div>
  <div class="seat" id="seatA" style="--x:33%"></div>
  <div class="seat" id="seatB" style="--x:67%"></div>
</main>
<div class="diag" id="diag"></div>
<div class="review" aria-hidden="true"><button onclick="location.reload()">replay</button><a href="./v3/">v3</a><a href="./v2/">v2</a><a href="./v1/">v1</a><button id="diagBtn">diag</button></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('seed')) document.documentElement.style.setProperty('--c', q.get('seed'));
const still = q.get('motion') === 'still' || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (q.get('diag')) document.body.classList.add('show-diag');
document.getElementById('diagBtn').onclick = () => document.body.classList.toggle('show-diag');

const EXAMPLE = ['1', '2'];
const BINARIES = [['Sharp','Smooth'],['Relaxed','Excited'],['Half-full','Half-empty'],['In control','Out of control'],['Quiet','Loud'],['Risk averse','Risk taker'],['Bright','Dark'],['Soft','Rough'],['Harmonic','Disharmonic']];
const CONDENSE_MS = 420, HOLD_MS = 430, THAW_MS = 3400;     // today's 850 + 3400, measured from readable
// read at ~200 wpm: 6 + 10 words ≈ 4.8s from the line, then it rises
const T = { dusk: 0, line: 350, hint: 1500, rise: 5600 };

const $ = (id) => document.getElementById(id);
const stage = $('stage'), line = $('line'), dusk = $('dusk'), seats = [$('seatA'), $('seatB')];
let timers = [], raf = 0;
const log = { mode: still ? 'untimed' : 'timed', example: null, pairs: [] };
const after = (ms, fn) => timers.push(setTimeout(fn, ms));
const showDiag = () => { $('diag').textContent = JSON.stringify(log, null, 1).replace(/[{}"\[\],]/g, '').replace(/\n\s*\n/g, '\n').trim(); };

$('hint').textContent = still
  ? 'Two at a time. Take your time, or let both go.'
  : 'Two at a time. Go with your gut, or let both fade.';

// 1 · THE LINE, in the middle, and one short line under it
after(T.dusk, () => dusk.classList.add('read'));
after(T.line, () => line.classList.add('in'));
after(T.hint, () => line.classList.add('hint'));

// 2 · THE RISE IS THE START. Both lines go up together; as they arrive, the
// first pair (1 and 2) condenses on the real clock. Nothing to press first.
after(T.rise, () => {
  line.classList.add('up');
  dusk.className = 'dusk play';
  after(still ? 300 : 1100, () => runPair(EXAMPLE, HOLD_MS, THAW_MS, (res) => {
    log.example = { status: res.status === 'chosen' ? 'chosen' : 'notTouched' }; showDiag();
    // the second line has done its job once the real words begin
    after(res.status === 'chosen' ? 1050 : 560, () => { line.classList.add('quiet'); round(0); });
  }));
});

// 5 · THE NINE — the risen line is the question. No counter, no history.
function round(i) {
  if (i >= BINARIES.length) return done();
  runPair(BINARIES[i], HOLD_MS, THAW_MS, (res) => { log.pairs.push({ i, ...res }); showDiag(); after(res.status === 'chosen' ? 1050 : 560, () => round(i + 1)); });
}
function done() {
  seats.forEach((s) => s.classList.add('hide'));
  line.style.transition = 'opacity .7s ease'; line.style.opacity = 0;
  after(900, () => { line.innerHTML = '<h2>(prototype ends — the camera rises to H5)</h2>'; line.style.opacity = 1; });
}

// One pair on the clock. Readable (fully condensed) is t = 0; taps before it
// don't count. A hidden tab hides the pair, then presents the same pair again.
function runPair([a, b], holdMs, thawMs, onEnd) {
  stage.querySelectorAll('.ember').forEach((e) => e.remove());
  stage.insertAdjacentHTML('beforeend',
    [a, b].map((w, k) => `<button class="ember${/^\d$/.test(w) ? ' is-number' : ''}" style="--x:${k ? 67 : 33}%"><span class="sphere"><span class="sphere-word">${w}</span></span></button>`).join(''));
  const els = [...stage.querySelectorAll('.ember')];
  seats.forEach((s) => s.classList.add('hide'));
  const t0 = performance.now(); let last = t0, readableAt = null, ended = false;
  const finish = (res) => { if (ended) return; ended = true; cancelAnimationFrame(raf); seats.forEach((s) => s.classList.remove('hide')); onEnd(res); };
  els.forEach((el) => el.onclick = () => {
    if (ended || readableAt === null) return;
    const other = els.find((e) => e !== el);
    el.dataset.caught = other.dataset.caught = '1';
    el.classList.add('is-caught'); other.classList.add('is-passed');
    finish({ status: 'chosen', word: el.textContent, ms: Math.round(performance.now() - readableAt), interrupted: !!runPair.interrupted });
  });
  const tick = (now) => {
    if (now - last > 500) { // she was away: the pair she never saw comes back
      ended = true; els.forEach((e) => e.remove());
      runPair.interrupted = true;
      return after(700, () => runPair([a, b], holdMs, thawMs, (r) => { runPair.interrupted = false; onEnd(r); }));
    }
    last = now;
    const e = now - t0; let op, scale = 1, glow = 1;
    if (e < CONDENSE_MS) { const k = 1 - Math.pow(1 - e / CONDENSE_MS, 3); op = k; scale = 0.88 + 0.12 * k; }
    else {
      if (readableAt === null) readableAt = now;
      const r = now - readableAt;
      if (still || r < holdMs) { op = 1; scale = 1 + (still ? 0 : Math.sin(r / 520) * 0.015); }
      else {
        const tp = Math.min(1, (r - holdMs) / thawMs);
        scale = 1 - tp * 0.16; glow = Math.max(0.05, 1 - tp * 0.95); op = tp < 0.78 ? 1 : Math.max(0, (1 - tp) / 0.22);
        if (tp >= 1) { els.forEach((el) => el.dataset.caught = '1'); return finish({ status: 'timedOut', ms: null, interrupted: !!runPair.interrupted }); }
      }
    }
    els.forEach((el) => { if (!el.dataset.caught) { el.style.opacity = op; el.style.setProperty('--ember-scale', scale.toFixed(3)); el.style.setProperty('--ember-glow', glow.toFixed(3)); } });
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  if (still) {
    stage.querySelector('.let-go')?.remove();
    stage.insertAdjacentHTML('beforeend', '<button class="let-go">Neither — let them go</button>');
    const lg = stage.querySelector('.let-go');
    lg.onclick = () => { lg.remove(); els.forEach((el) => { el.dataset.caught = '1'; el.classList.add('is-passed'); }); finish({ status: 'skipped', ms: null, interrupted: false }); };
    els.forEach((el) => el.addEventListener('click', () => lg.remove()));
  }
}
showDiag();
</script>
</body>
</html>
