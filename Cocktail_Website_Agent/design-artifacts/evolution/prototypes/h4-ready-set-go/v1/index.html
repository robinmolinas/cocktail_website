<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>H4 prototype — clear practice, then Ready · Set · Go</title>
<!-- Prototype for review (2026-10-06). Not production. Material, type and
     timings are copied from dionysus-experience/src/index.css and
     TheDepths.tsx so it reads like the real hold. Options: ?seed=%23c8102e
     (her colour), ?motion=still (Still Water / reduced motion), ?diag=1
     (show the captured timing the matching owner specified). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Playfair:ital,opsz,wght@0,5..1200,300..700;1,5..1200,300..700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
:root {
  --font-display: 'Playfair Display', Georgia, serif;
  --font-text: 'Playfair', 'Playfair Display', Georgia, serif;
  --font-label: 'Jost', 'Futura', system-ui, sans-serif;
  --legible: 0 1px 2px rgba(22, 11, 4, 0.26);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --sphere-rim: rgba(255, 235, 200, 0.22);
  --sphere-hover-rim: rgba(255, 176, 136, 0.6);
  --sphere-hover-shadow: inset 0 1px 16px rgba(255, 235, 200, 0.15), 0 0 34px -6px rgba(255, 176, 136, 0.45);
  --veil-pill-border: rgba(255, 255, 255, 0.16);
  --veil-pill-bg: rgba(255, 255, 255, 0.03);
  --veil-pill-hover-border: rgba(255, 176, 136, 0.6);
  --veil-pill-hover-bg: rgba(255, 255, 255, 0.06);
  --c: #e8702a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0d0b09; overflow: hidden; }
body { font-family: var(--font-text); color: #fbf4e8; -webkit-tap-highlight-color: transparent; }
.world { position: fixed; inset: 0; background: url('../hold-5_7.jpg') center / cover no-repeat; }
.mark { position: fixed; top: clamp(18px, 3.2vh, 30px); left: clamp(20px, 6.5vw, 104px); font-family: var(--font-display); font-style: italic; font-size: 20px; text-shadow: var(--legible); z-index: 5; }

@keyframes heroFadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: none; } }
@keyframes holdOut { to { opacity: 0; filter: blur(5px); transform: translateY(-8px); } }
@keyframes nextIn { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

/* the voice — unchanged from the app */
.hold-head { position: absolute; left: 50%; top: 12.5%; width: min(640px, 88vw); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.7rem; text-align: center; pointer-events: none; z-index: 4; }
.hold-head.is-leaving { animation: holdOut 0.6s ease forwards; }
.hold-q { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(1.4rem, 3vmin, 1.85rem); line-height: 1.25; color: #fbf4e8; text-shadow: var(--legible); text-wrap: balance; animation: heroFadeUp 0.8s ease both; }
.hold-hint { margin: 0; font-family: var(--font-text); font-size: clamp(15px, 1.9vmin, 17px); line-height: 1.5; color: rgba(245, 234, 216, 0.9); text-shadow: var(--legible); text-wrap: balance; animation: heroFadeUp 1s ease 0.45s both; }
/* NEW — the round's quiet label: tracked caps, the same voice as the Veil pill */
.hold-kicker { margin: 0; font-family: var(--font-label); font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: rgba(245, 234, 216, 0.78); text-shadow: var(--legible); animation: heroFadeUp 0.8s ease both; }

/* the way onward — the Veil pill */
.pills { position: absolute; left: 0; right: 0; bottom: 12.5%; display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; z-index: 4; }
.hold-next { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(245, 234, 216, 0.86); border: 1px solid var(--veil-pill-border); border-radius: 999px; padding: 0.66rem 1.95rem 0.66rem 2.1rem; min-height: 44px; background: var(--veil-pill-bg); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); cursor: pointer; animation: nextIn 0.7s var(--ease) var(--next-delay, 0s) both; transition: border-color 0.4s, background 0.4s, color 0.4s; }
.hold-next:hover, .hold-next:focus-visible { border-color: var(--veil-pill-hover-border); background: var(--veil-pill-hover-bg); color: #fffaf0; outline: none; }
.hold-next.is-quiet { border-color: transparent; background: none; backdrop-filter: none; color: rgba(245, 234, 216, 0.7); }
.hold-next.is-leaving { animation: holdOut 0.5s ease forwards; pointer-events: none; }

/* NEW — the two places the words will be. Hairline rings that hold the
   choice positions still from the instruction onward, so the eye already
   knows where to look and nothing moves when the clock starts. */
.seat { position: absolute; top: 50%; left: var(--x); width: clamp(150px, 21vmin, 204px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(255, 235, 200, 0.16); opacity: 0; transition: opacity 0.9s ease, border-color 0.6s ease; pointer-events: none; z-index: 2; }
.seat.on { opacity: 1; }
.seat.warm { border-color: color-mix(in srgb, var(--c) 45%, rgba(255, 235, 200, 0.2)); }

/* the embers — copied from the app's TWIN SPHERES rev 4 */
.ember { position: absolute; top: 50%; left: var(--x); transform: translate(-50%, -50%); opacity: 0; border: none; background: none; padding: 10px; cursor: pointer; z-index: 3; }
.ember[data-caught] { transition: opacity 0.5s ease; }
.sphere { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 50%; text-align: center; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.ember .sphere { width: clamp(150px, 21vmin, 204px); padding: 0 18px; transform: translateY(calc((1 - var(--ember-glow, 1)) * 14px)) scale(var(--ember-scale, 1));
  border: 1px solid rgb(255 235 200 / calc(0.08 + var(--ember-glow, 1) * 0.2));
  background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / calc(0.16 * var(--ember-glow, 1))) 0%, rgb(255 255 255 / calc(0.04 * var(--ember-glow, 1))) 42%, rgb(255 235 200 / calc(0.08 * var(--ember-glow, 1))) 100%);
  box-shadow: inset 0 1px 13px rgb(255 235 200 / calc(0.1 * var(--ember-glow, 1))), 0 0 22px -8px rgb(255 176 136 / calc(0.3 * var(--ember-glow, 1))); }
.sphere-word { position: relative; font-family: var(--font-display); font-style: italic; font-weight: 500; color: #fbf4e8; text-shadow: var(--legible); text-wrap: balance; }
.ember .sphere-word { font-size: clamp(1.35rem, 3vmin, 1.95rem); line-height: 1.1; opacity: calc(0.6 + var(--ember-glow, 1) * 0.4); filter: blur(calc(max(0, 0.3 - var(--ember-glow, 1)) * 10px)); }
@media (hover: hover) { .ember:hover .sphere { border-color: var(--sphere-hover-rim); box-shadow: var(--sphere-hover-shadow); } }
.ember .sphere::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 56%, color-mix(in srgb, var(--c) 72%, rgba(255, 244, 226, 0.6)) 0%, color-mix(in srgb, var(--c) 36%, transparent) 48%, transparent 74%); opacity: 0; transform: scale(0.25); pointer-events: none; }
@keyframes emberBloom { from { opacity: 0; transform: scale(0.25); } to { opacity: 1; transform: scale(1); } }
@keyframes emberRise { 0% { transform: scale(var(--ember-scale, 1)); opacity: 1; } 30% { transform: translateY(-5px) scale(1.07); opacity: 1; } 62% { opacity: 0.9; filter: blur(0.5px); } 100% { transform: translateY(-84px) scale(1.12); filter: blur(5px); opacity: 0; } }
@keyframes emberSink { from { transform: scale(var(--ember-scale, 1)); filter: blur(0); } to { transform: translateY(30px) scale(0.9); filter: blur(5px); } }
.ember.is-caught { opacity: 1 !important; pointer-events: none; }
.ember.is-caught .sphere { border-color: color-mix(in srgb, var(--c) 70%, white); box-shadow: inset 0 1px 18px rgba(255, 235, 200, 0.2), 0 0 44px -6px var(--c); animation: emberRise 1.05s cubic-bezier(0.33, 0, 0.25, 1) both; }
.ember.is-caught .sphere::before { animation: emberBloom 0.42s var(--ease) both; }
.ember.is-caught .sphere-word { color: #fffaf0; opacity: 1; filter: none; }
.ember.is-passed { pointer-events: none; transition: opacity 0.75s ease; opacity: 0 !important; }
.ember.is-passed .sphere { animation: emberSink 0.8s cubic-bezier(0.4, 0, 0.7, 1) both; }

/* NEW — READY · SET · GO. Restraint over spectacle: each word condenses
   out of the liquid between the two seats, holds a breath, and dissolves
   upward the way a chosen sphere does; under it a single hairline ring in
   her colour draws inward, a drop's surface closing. Go never lingers —
   as it lifts, the first pair condenses in the seats. */
.count { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1px; height: 1px; z-index: 3; pointer-events: none; }
.count-word { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(2.6rem, 7vmin, 4.2rem); letter-spacing: 0.01em; color: #fffaf0; text-shadow: var(--legible), 0 0 26px color-mix(in srgb, var(--c) 35%, transparent); white-space: nowrap; animation: countBeat var(--beat) var(--ease) both; }
@keyframes countBeat {
  0% { opacity: 0; filter: blur(8px); transform: translate(-50%, -38%) scale(0.94); }
  28% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); }
  70% { opacity: 1; filter: blur(0); transform: translate(-50%, -52%) scale(1.01); }
  100% { opacity: 0; filter: blur(6px); transform: translate(-50%, -78%) scale(1.04); }
}
.count-ring { position: absolute; left: 50%; top: 50%; width: clamp(150px, 26vmin, 240px); aspect-ratio: 1; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--c) 70%, rgba(255, 240, 220, 0.5)); transform: translate(-50%, -50%) scale(1); opacity: 0; animation: ringClose var(--beat) cubic-bezier(0.5, 0, 0.2, 1) both; }
@keyframes ringClose { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } 25% { opacity: 0.75; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); } }

/* NEW — the quiet result line after practice */
.practice-note { position: absolute; left: 0; right: 0; top: 72%; margin: 0 auto; width: min(560px, 86vw); text-align: center; font-family: var(--font-text); font-style: italic; font-size: clamp(15px, 1.9vmin, 17px); color: rgba(245, 234, 216, 0.92); text-shadow: var(--legible); animation: heroFadeUp 0.8s ease both; z-index: 4; }

/* diagnostics (prototype only, ?diag=1): the timing the UI would capture */
.diag { position: fixed; right: 10px; bottom: 10px; z-index: 9; font: 11px/1.45 ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, 0.85); background: rgba(0, 0, 0, 0.6); padding: 8px 10px; border-radius: 6px; max-width: 320px; white-space: pre-wrap; display: none; pointer-events: none; }
@media (max-width: 640px) { .diag { top: 64px; bottom: auto; font-size: 9px; max-width: 150px; opacity: 0.8; } }
body.show-diag .diag { display: block; }
.review { position: fixed; left: 10px; bottom: 10px; z-index: 9; font: 11px ui-monospace, Menlo, monospace; display: flex; gap: 4px; }
.review button { font: inherit; color: #fff; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 4px 7px; cursor: pointer; }

@media (max-width: 640px) {
  .practice-note { top: 70%; }
  .ember, .seat { left: calc(50% + (var(--x) - 50%) * 1.42); }
  .ember .sphere, .seat { width: clamp(124px, 37vw, 156px); }
  .ember .sphere { padding: 0 12px; }
  /* thumbs: the pair sits a little lower on a phone, inside easy reach */
  .ember, .seat { top: 55%; }
  .count { top: 55%; }
}
@media (prefers-reduced-motion: reduce) { .count-word, .count-ring { animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
<div class="world" aria-hidden="true"></div>
<div class="mark">Dionysus</div>
<main id="stage" aria-live="polite"></main>
<div class="diag" id="diag"></div>
<div class="review" aria-hidden="true">
  <button data-go="intro">intro</button><button data-go="practice">practice</button><button data-go="count">ready·set·go</button><button data-go="round">round 1</button><button id="diagBtn">diag</button>
</div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('seed')) document.documentElement.style.setProperty('--c', q.get('seed'));
const still = q.get('motion') === 'still' || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (q.get('diag')) document.body.classList.add('show-diag');
document.getElementById('diagBtn').onclick = () => document.body.classList.toggle('show-diag');

const PRACTICE = { a: 'Tea', b: 'Coffee' };
const BINARIES = [['Sharp','Smooth'],['Relaxed','Excited'],['Half-full','Half-empty'],['In control','Out of control'],['Quiet','Loud'],['Risk averse','Risk taker'],['Bright','Dark'],['Soft','Rough'],['Harmonic','Disharmonic']];
// The app's clock, with one change: the window is measured from the moment
// both words are READABLE (fully condensed), never from the instruction.
const CONDENSE_MS = 420, HOLD_MS = 430, THAW_MS = 3400;   // 850 + 3400 = today's ROUND_MS
const BEAT_MS = 760;                                       // one Ready/Set/Go beat

const stage = document.getElementById('stage');
const diag = document.getElementById('diag');
let timers = [], raf = 0, log = { mode: still ? 'untimed' : 'timed', practice: [], pairs: [] };
const after = (ms, fn) => timers.push(setTimeout(fn, ms));
const clear = () => { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); };
const showDiag = () => { diag.textContent = JSON.stringify(log, null, 1).replace(/[{}"\[\],]/g, '').replace(/\n\s*\n/g, '\n').trim(); };

const seats = () => `<div class="seat on" style="--x:33%"></div><div class="seat on" style="--x:67%"></div>`;
const head = (kicker, qText, hint) => `<div class="hold-head">${kicker ? `<p class="hold-kicker">${kicker}</p>` : ''}<h2 class="hold-q">${qText}</h2>${hint ? `<p class="hold-hint">${hint}</p>` : ''}</div>`;

// 1 · ONE CLEAR INSTRUCTION. She reads at her own pace; nothing is timed
// until she asks for it. The seats are already where the words will be.
function intro() {
  clear();
  stage.innerHTML = head('', 'Tap the word that is more you.',
      still ? 'Two words at a time. Take as long as you need. If neither is you, let them go.'
            : 'Two words at a time, a few seconds each. If neither is you, let them fade. That counts too.')
    + seats()
    + `<div class="pills"><button class="hold-next" style="--next-delay:1.1s" id="try">Try one first</button></div>`;
  document.getElementById('try').onclick = practice;
}

// 2 · THE REHEARSAL. Same clock as the real thing, so it teaches the real
// pace — but it is labelled, unscored, and can be repeated.
function practice() {
  clear();
  stage.innerHTML = head('Practice', 'Tea or coffee?', '') + seats();
  runPair(PRACTICE.a, PRACTICE.b, (res) => {
    log.practice.push(res); showDiag();
    const note = res.status === 'chosen' ? `${res.word}. That’s all it is.`
      : res.status === 'skipped' ? 'You let them go. That counts too: it stays a secret.'
      : 'It faded. That’s fine. Whatever fades stays a secret.';
    after(900, () => {
      stage.innerHTML = head('Practice', 'Tea or coffee?', '') + seats()
        + `<p class="practice-note">${note}</p>`
        + `<div class="pills"><button class="hold-next is-quiet" id="again">Practise again</button><button class="hold-next" id="ready">I’m ready</button></div>`;
      document.getElementById('again').onclick = practice;
      document.getElementById('ready').onclick = () => countIn();
    });
  });
}

// 3 · READY · SET · GO. The only countdown in the journey: three beats,
// then the first real pair condenses exactly where practice did.
function countIn(then = () => round(0)) {
  clear();
  const keep = stage.querySelector('.hold-head');
  if (keep) keep.classList.add('is-leaving');
  stage.querySelectorAll('.pills,.practice-note').forEach((el) => el.remove());
  if (!stage.querySelector('.seat')) stage.insertAdjacentHTML('beforeend', seats());
  const beat = still ? 600 : BEAT_MS;
  ['Ready', 'Set', 'Go'].forEach((w, i) => after(400 + i * beat, () => {
    stage.querySelector('.count')?.remove();
    stage.insertAdjacentHTML('beforeend', `<div class="count" style="--beat:${beat}ms"><span class="count-ring"></span><span class="count-word">${w}</span></div>`);
    stage.querySelectorAll('.seat').forEach((s) => s.classList.toggle('warm', i === 2));
  }));
  after(400 + 3 * beat - 260, () => { stage.querySelector('.count')?.remove(); then(); });
}

// 4 · THE NINE. One question line, no history row, no counter that looks
// like a stepper. (A quiet "3 of 9" kicker is the alternative to test.)
function round(i) {
  clear();
  if (i >= BINARIES.length) return done();
  const leaving = stage.querySelector('.hold-head:not(.is-leaving)');
  if (!stage.querySelector('.hold-head.rounds')) {
    stage.querySelectorAll('.hold-head').forEach((h) => h.remove());
    stage.insertAdjacentHTML('afterbegin', head('', 'Which is more you?', '').replace('hold-head', 'hold-head rounds'));
  }
  const [a, b] = BINARIES[i];
  runPair(a, b, (res) => { log.pairs.push({ i, ...res }); showDiag(); after(res.status === 'chosen' ? 1050 : 560, () => round(i + 1)); }, i);
}

function done() {
  stage.querySelectorAll('.seat').forEach((s) => s.classList.remove('on'));
  stage.querySelector('.hold-head')?.classList.add('is-leaving');
  after(900, () => { stage.innerHTML = head('', 'The depths keep what you gave them.', '(prototype ends — the camera would rise to H5)') + `<div class="pills"><button class="hold-next" onclick="location.reload()">Start over</button></div>`; });
}

// One pair on the clock. Readable = both words fully condensed: that is t=0.
function runPair(a, b, onEnd, idx) {
  stage.querySelectorAll('.ember').forEach((e) => e.remove());
  stage.insertAdjacentHTML('beforeend',
    `<button class="ember" style="--x:33%" data-side="a"><span class="sphere"><span class="sphere-word">${a}</span></span></button>` +
    `<button class="ember" style="--x:67%" data-side="b"><span class="sphere"><span class="sphere-word">${b}</span></span></button>`);
  const els = [...stage.querySelectorAll('.ember')];
  stage.querySelectorAll('.seat').forEach((s) => s.classList.remove('on'));
  const t0 = performance.now();
  let readableAt = null, ended = false, interrupted = false;
  const finish = (res) => { if (ended) return; ended = true; stage.querySelectorAll('.seat').forEach((s) => s.classList.add('on')); cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', onVis); onEnd({ ...res, interrupted }); };
  els.forEach((el) => el.onclick = () => {
    if (ended || readableAt === null && !still) { /* tap during condensation still counts */ }
    const ms = readableAt === null ? 0 : Math.round(performance.now() - readableAt);
    const other = els.find((e) => e !== el);
    el.dataset.caught = other.dataset.caught = '1';
    el.classList.add('is-caught'); other.classList.add('is-passed');
    finish({ status: 'chosen', word: el.textContent, ms });
  });
  // Interruption: a hidden tab pauses the pair; on return Set → Go replays
  // and the SAME pair is presented again (agreed with the matching owner).
  const onVis = () => {
    if (document.visibilityState !== 'hidden' || ended) return;
    interrupted = true; ended = true; cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', onVis);
    els.forEach((e) => e.remove());
    const back = () => { if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', back); replay(); } };
    document.addEventListener('visibilitychange', back);
  };
  const replay = () => {
    const beat = still ? 600 : BEAT_MS;
    ['Set', 'Go'].forEach((w, k) => after(300 + k * beat, () => { stage.querySelector('.count')?.remove(); stage.insertAdjacentHTML('beforeend', `<div class="count" style="--beat:${beat}ms"><span class="count-ring"></span><span class="count-word">${w}</span></div>`); }));
    after(300 + 2 * beat - 260, () => { stage.querySelector('.count')?.remove(); runPair(a, b, (res) => onEnd({ ...res, interrupted: true }), idx); });
  };
  document.addEventListener('visibilitychange', onVis);
  const tick = (now) => {
    const e = now - t0;
    let op, scale, glow;
    if (e < CONDENSE_MS) { const k = 1 - Math.pow(1 - e / CONDENSE_MS, 3); op = k; scale = 0.88 + 0.12 * k; glow = 1; }
    else {
      if (readableAt === null) readableAt = now;
      const r = now - readableAt;
      if (still || r < HOLD_MS) { op = 1; scale = 1 + Math.sin(r / 520) * (still ? 0 : 0.015); glow = 1; }
      else {
        const tp = Math.min(1, (r - HOLD_MS) / THAW_MS);
        scale = 1 - tp * 0.16; glow = Math.max(0.05, 1 - tp * 0.95); op = tp < 0.78 ? 1 : Math.max(0, (1 - tp) / 0.22);
        if (tp >= 1) { els.forEach((el) => el.dataset.caught = '1'); return finish({ status: 'timedOut', ms: null }); }
      }
    }
    els.forEach((el) => { if (!el.dataset.caught) { el.style.opacity = op; el.style.setProperty('--ember-scale', scale.toFixed(3)); el.style.setProperty('--ember-glow', glow.toFixed(3)); } });
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  if (still) {
    stage.querySelector('.pills')?.remove();
    stage.insertAdjacentHTML('beforeend', `<div class="pills"><button class="hold-next is-quiet" id="cool">Neither — let them go</button></div>`);
    document.getElementById('cool').onclick = () => { els.forEach((el) => { el.dataset.caught = '1'; el.classList.add('is-passed'); }); stage.querySelector('.pills')?.remove(); finish({ status: 'skipped', ms: null }); };
  }
}

document.querySelectorAll('.review [data-go]').forEach((b) => b.onclick = () => {
  stage.innerHTML = '';
  ({ intro, practice, count: () => { stage.innerHTML = seats(); countIn(); }, round: () => { stage.innerHTML = seats(); round(0); } })[b.dataset.go]();
});
showDiag();
intro();
</script>
</body>
</html>
