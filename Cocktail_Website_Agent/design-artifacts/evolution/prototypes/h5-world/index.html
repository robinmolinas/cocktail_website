<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>H5 prototype — A world of your own</title>
<!-- H5 · "A world of your own" (2026-10-06 concept prototype, not production)
     Robin's brief: ask what people come to you for FIRST, so she constitutes
     herself; then let her reach out toward what draws her. Gravity, planets,
     integration. "You" is one circle that never changes object; no glass yet.

       Her birth · her H2 seed opens into a bubble of her own colour: a thin
         lit skin around an empty centre.
       Round 1 · What do people come to you for? The words are already in
         her pull: they ride a slow orbit around her. Touch one (or carry it
         to her) and its orbit gives way: it falls in along a curve, gathering
         speed, meets her skin with a ripple, and stays inside her as written
         light. Each one fills her a little. Touch it inside her to let it go.
       The turn · she is whole. She kindles once, and the first light she gives
         travels out across the dark. The farther words are found by it.
       Round 2 · What are you most drawn toward right now? Now the movement
         reverses. Touch a word and part of her light leaves her, curving
         across the dark the way matter streams between two stars, and settles
         around that word as a ring. What draws her wears her colour. Touch it
         again and the ring unwinds home.
       The end · her world: a lit body holding what others find in her,
         ringed bodies around her that she is drawn to, turning together.
     Same answers as before: up to three each, reversible, stored in
     vocabulary order. No order, distance, speed or drag path is captured.
     Options: ?seed=%231287c8  ?n=12 (round-2 Q12 list)  ?motion=still
              ?drag=0 (tap only) -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Playfair:ital,opsz,wght@0,5..1200,300..700;1,5..1200,300..700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
<style>
:root {
  --font-display: 'Playfair Display', Georgia, serif;
  --font-text: 'Playfair', 'Playfair Display', Georgia, serif;
  --font-label: 'Jost', system-ui, sans-serif;
  --legible: 0 1px 2px rgba(22, 11, 4, 0.26);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --sphere-rim: rgba(255, 235, 200, 0.22);
  --sphere-fill: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.035) 42%, rgba(255, 235, 200, 0.06) 100%);
  --c: #ff6f1f;
  --word: clamp(92px, 11vmin, 110px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #060505; overflow: hidden; }
body { color: #fbf4e8; font-family: var(--font-text); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.world { position: fixed; inset: 0; background: url('../h5-two-directions/hold-8_2.jpg') center / cover no-repeat; }
.world::after { content: ''; position: absolute; inset: 0; background: radial-gradient(130% 100% at 50% 50%, rgba(5, 4, 8, 0.6), rgba(5, 4, 8, 0.82)); }
.mark { position: fixed; top: clamp(18px, 3.2vh, 30px); left: clamp(20px, 6.5vw, 104px); font-family: var(--font-display); font-style: italic; font-size: 20px; z-index: 8; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#back { z-index: 2; }   /* her, the streams, the far half of each ring */
#front { z-index: 4; }  /* the near half of each ring */

@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes holdOut { to { opacity: 0; filter: blur(5px); transform: translateY(-8px); } }
#stage { position: fixed; inset: 0; overflow: hidden; }
.head { position: absolute; left: 50%; top: 11%; width: min(640px, 88vw); translate: -50% 0; text-align: center; z-index: 6; pointer-events: none; }
.head.out { animation: holdOut 0.7s ease forwards; }
.head h2 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(1.4rem, 3vmin, 1.85rem); line-height: 1.25; text-shadow: var(--legible); text-wrap: balance; animation: rise 1s var(--ease) var(--hd, 0ms) both; }
.head p { margin: 0.65rem 0 0; font-size: clamp(15px, 1.9vmin, 17px); line-height: 1.5; color: rgba(245, 234, 216, 0.86); text-shadow: var(--legible); animation: rise 1s var(--ease) calc(var(--hd, 0ms) + 350ms) both; }

/* the words: glass bodies, the journey's one "choose me" material */
.field { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.slot { position: absolute; left: 0; top: 0; will-change: transform; }
.drift { animation: driftA 6.4s ease-in-out infinite alternate; }
.slot:nth-child(even) .drift { animation-name: driftB; animation-duration: 7.1s; }
.slot:nth-child(3n) .drift { animation-duration: 7.7s; animation-delay: -2.2s; }
@keyframes driftA { to { transform: translate(3px, -6px); } }
@keyframes driftB { to { transform: translate(-4px, 5px); } }
.word { pointer-events: auto; border: 0; background: none; padding: 6px; margin: 0; cursor: pointer; color: inherit; font: inherit; display: block;
  translate: -50% -50%; touch-action: none;   /* its own property: the rise animation owns `transform` */
  opacity: 0; animation: rise 1.1s var(--ease) var(--d, 0ms) both; transition: opacity 0.7s ease, filter 0.7s ease; }
.word .glass { display: flex; align-items: center; justify-content: center; width: var(--word); aspect-ratio: 1; border-radius: 50%; padding: 0 10px; text-align: center;
  border: 1px solid var(--sphere-rim); background: var(--sphere-fill); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  transition: border-color 0.6s ease, box-shadow 0.8s ease, transform 0.4s var(--ease); }
.word span { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(14px, 1.75vmin, 16.5px); line-height: 1.2; text-shadow: var(--legible); text-wrap: balance; }
@media (hover: hover) { .word:not(.falling):hover .glass { border-color: rgba(255, 176, 136, 0.5); transform: scale(1.04); } }
.word:focus-visible { outline: none; } .word:focus-visible .glass { outline: 2px solid var(--c); outline-offset: 4px; }
.word.unseen { animation: none; opacity: 0; pointer-events: none; }
.word.found { animation: rise 1.4s var(--ease) both; }
.word.dim { filter: saturate(0.6) brightness(0.78); }
@keyframes refuse { 25% { transform: translateX(-4px); } 60% { transform: translateX(3px); } }
.word.refused .glass { animation: refuse 0.42s ease; }
.word.falling, .word.lifting { animation: none; opacity: 1; pointer-events: none; transition: none; }
.word.inside { animation: none; opacity: 0; pointer-events: none; }
.word.dragging { animation: none; opacity: 1; transition: none; cursor: grabbing; }
.word.dragging .glass { border-color: color-mix(in srgb, var(--c) 45%, rgba(255, 240, 220, 0.45)); }
/* round 2: her light has gone around it */
.word.ringed .glass { border-color: color-mix(in srgb, var(--c) 50%, rgba(255, 240, 220, 0.42)); box-shadow: 0 0 34px -12px var(--c), inset 0 0 22px -14px var(--c); }
.word.leaving { animation: none; opacity: 0; filter: blur(6px); pointer-events: none; }

/* what she holds: the words people come to her for, written inside her */
.held { position: absolute; z-index: 5; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 0; pointer-events: none; }
.held button { pointer-events: auto; border: 0; background: none; color: #fffaf0; cursor: pointer; padding: 0.12rem 0.5rem; min-height: 28px; white-space: nowrap;
  font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(13px, 1.6vmin, 15.5px); text-shadow: 0 1px 2px rgba(22, 11, 4, 0.42), 0 0 8px rgba(10, 6, 4, 0.26);
  animation: rise 0.9s var(--ease) both; }
.held.locked button { pointer-events: none; }
.held button:focus-visible { outline: 1px solid rgba(255, 240, 220, 0.6); outline-offset: 2px; border-radius: 999px; }

.next { position: absolute; left: 0; right: 0; bottom: 4.6%; margin: 0 auto; width: fit-content; min-height: 44px; z-index: 6;
  font-family: var(--font-label); font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(245, 234, 216, 0.84);
  border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 0.66rem 1.95rem 0.66rem 2.1rem; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(4px);
  cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.6s ease, border-color 0.4s ease, color 0.4s ease; }
.next.ready { opacity: 1; pointer-events: auto; }
.next.full { color: #fffaf0; border-color: color-mix(in srgb, var(--c) 55%, rgba(255, 246, 228, 0.25)); }
.next:hover, .next:focus-visible { border-color: rgba(255, 176, 136, 0.6); outline: none; }

.review { position: fixed; left: 10px; bottom: 10px; z-index: 9; display: flex; gap: 4px; font: 11px ui-monospace, Menlo, monospace; }
.review button, .review a { font: inherit; color: #fff; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 4px 7px; cursor: pointer; text-decoration: none; }
.review .sw { width: 20px; padding: 0; }
.log { position: fixed; right: 10px; bottom: 10px; z-index: 9; font: 11px/1.4 ui-monospace, Menlo, monospace; background: rgba(0, 0, 0, 0.6); padding: 6px 9px; border-radius: 6px; white-space: pre; pointer-events: none; }
@media (max-width: 640px) {
  :root { --word: clamp(80px, min(24vw, 11vh), 100px); }
  .head { top: 8.5%; }
  .next { bottom: 3.6%; }
  .log { bottom: 40px; font-size: 9px; }
  .review { flex-wrap: wrap; max-width: 60vw; bottom: auto; top: 6px; left: auto; right: 6px; justify-content: flex-end; opacity: 0.7; }
}
@media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
</style>
</head>
<body>
<div class="world" aria-hidden="true"></div>
<canvas id="back" aria-hidden="true"></canvas>
<canvas id="front" aria-hidden="true"></canvas>
<div class="mark">Dionysus</div>
<main id="stage"></main>
<div class="log" id="log"></div>
<div class="review" aria-hidden="true">
  <button onclick="location.reload()">replay</button>
  <a id="nToggle"></a><a id="mToggle"></a><a id="dToggle"></a>
  <span id="swatches" style="display:flex;gap:3px"></span>
</div>
<script>
/* ------------------------------------------------------------------ setup */
const q = new URLSearchParams(location.search);
const SEEDS = ['#c8102e', '#ff6f1f', '#f2c24e', '#58b947', '#1287c8', '#7b5aa6', '#f2789f', '#5c2447'];
const seedHex = q.get('seed') || '#ff6f1f';
document.documentElement.style.setProperty('--c', seedHex);
const still = q.get('motion') === 'still' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const twelve = q.get('n') === '12';
const dragOn = q.get('drag') !== '0';
const link = (el, key, on, off, label) => { const u = new URLSearchParams(q); if (q.get(key) === on) u.delete(key); else u.set(key, on); el.href = '?' + u; el.textContent = label(q.get(key) === on); };
link(document.getElementById('nToggle'), 'n', '12', '', (on) => (on ? '12 words' : '9 words'));
link(document.getElementById('mToggle'), 'motion', 'still', '', (on) => (on ? 'still' : 'motion'));
link(document.getElementById('dToggle'), 'drag', '0', '', (on) => (on ? 'tap only' : 'tap + carry'));
const sw = document.getElementById('swatches');
SEEDS.forEach((h) => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = h; b.title = h; b.onclick = () => { q.set('seed', h); location.search = q; }; sw.append(b); });

// Robin, 2026-10-06: what people come to you for comes FIRST (she gathers
// herself), then what draws you (she reaches out). The 12-word list is Q12.
const ROUNDS = [
  { key: 'soughtFor', q: 'What do people often come to you for?', hint: 'Choose up to three.',
    words: ['Advice', 'Comfort', 'Honesty', 'Courage', 'Ideas', 'Calm', 'Taste', 'A reality check', 'A little chaos'] },
  { key: 'drawnToward', q: 'What are you most drawn toward right now?', hint: 'Choose up to three.',
    words: twelve
      ? ['Freedom', 'Beauty', 'Mastery', 'Peace', 'Belonging', 'Pleasure', 'Wonder', 'Change', 'Knowledge', 'Influence', 'Making', 'Caring']
      : ['Freedom', 'Beauty', 'Mastery', 'Peace', 'Belonging', 'Pleasure', 'Wonder', 'Change', 'Mischief'] },
];
const MAX = 3;
const answers = { soughtFor: [], drawnToward: [] };
const stage = document.getElementById('stage');
const logEl = document.getElementById('log');
const log = () => { logEl.textContent = `soughtFor:   ${answers.soughtFor.join(', ') || '—'}\ndrawnToward: ${answers.drawnToward.join(', ') || '—'}`; };

const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const IVORY = [255, 242, 222];
const SEED = hexRgb(seedHex);
// Her colour only ever appears as light. The darkest seeds (plum, violet)
// are lifted toward ivory so they glow rather than stain.
const lum = (0.2126 * SEED[0] + 0.7152 * SEED[1] + 0.0722 * SEED[2]) / 255;
const LIGHT = SEED.map((c, i) => Math.round(c + (IVORY[i] - c) * (lum < 0.25 ? 0.34 : lum < 0.45 ? 0.2 : 0.1)));
const SEED_DEEP = SEED.map((c) => Math.round(c * 0.78));
// the brighter her colour, the clearer her interior, so ivory writing inside
// her reads on every seed (gold would otherwise swallow it)
const CLEAR = Math.max(0.45, Math.min(1, 1.25 - lum));
const WARM = LIGHT.map((c, i) => Math.round(c + (IVORY[i] - c) * 0.55));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const isPhone = () => innerWidth <= 640;
const T = (ms) => (still ? Math.min(ms, 1) : ms);

/* -------------------------------------------------------------- canvases */
const back = document.getElementById('back'), front = document.getElementById('front');
const bx = back.getContext('2d'), fx = front.getContext('2d');
function sizeCanvases() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  for (const [c, x] of [[back, bx], [front, fx]]) { c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
}
// one soft point of her light, drawn many times
const sprite = document.createElement('canvas'); sprite.width = sprite.height = 32;
{ const s = sprite.getContext('2d'); const g = s.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, rgba([255, 250, 240], 1)); g.addColorStop(0.18, rgba(WARM, 0.9)); g.addColorStop(0.45, rgba(LIGHT, 0.35)); g.addColorStop(1, rgba(LIGHT, 0));
  s.fillStyle = g; s.fillRect(0, 0, 32, 32); }
const dot = (ctx, x, y, size, a) => { ctx.globalAlpha = a; ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size); };

/* ------------------------------------------------------------------- her */
const self = { x: 0, y: 0, R: 0, born: 0, fill: 0, fillTo: 0, kindle: 0, ripples: [], pulls: new Map() };
function placeSelf() {
  const phone = isPhone();
  self.x = innerWidth / 2;
  self.y = innerHeight * (phone ? 0.285 : 0.54);
  self.R = phone ? Math.min(60, innerWidth * 0.155) : Math.min(92, innerHeight * 0.1);
}

/* ------------------------------------------------------------- the words */
// state per word: free · falling · inside · lifting (round 1) | free · ringed (round 2)
let round = 0, words = [], locked = false;
const wordR = () => (words[0] ? words[0].el.querySelector('.glass').offsetWidth / 2 : 50);

function layout(n, ri) {
  const phone = isPhone();
  if (phone) {
    // a phone stacks them under her in threes; same place both rounds
    const cols = 3, rows = Math.ceil(n / cols);
    const size = wordR() * 2 || 96;
    const top = self.y + self.R + 30 + size / 2, bottom = innerHeight * 0.88 - 44 - size / 2;
    const step = Math.min(size + 18, (bottom - top) / Math.max(1, rows - 1));
    const y0 = top + Math.max(0, (bottom - top - step * (rows - 1)) / 2) * 0.5;
    const colW = Math.min(innerWidth / cols, size + 26);
    return Array.from({ length: n }, (_, i) => ({ x: self.x + ((i % cols) - 1) * colW, y: y0 + Math.floor(i / cols) * step + (rows === 3 && i % cols === 1 ? 8 : 0) }));
  }
  // desktop: round 1 rides an inner orbit (close enough to fall in);
  // round 2 waits on a far one, out where only her light can reach
  const rx = ri === 0 ? Math.min(innerWidth * 0.27, 380) : Math.min(innerWidth * 0.4, 600);
  const ry = ri === 0 ? Math.min(innerHeight * 0.255, 230) : Math.min(innerHeight * 0.29, 262);
  const off = Math.PI / n;   // never a word straight above or below her
  return Array.from({ length: n }, (_, i) => ({ a: -Math.PI / 2 + off + (i / n) * Math.PI * 2, rx, ry }));
}
const orbitPos = (o) => ({ x: self.x + Math.cos(o.a) * o.rx, y: self.y + Math.sin(o.a) * o.ry });

function startRound(ri, far) {
  round = ri; locked = false;
  const r = ROUNDS[ri];
  stage.innerHTML = `<div class="head" style="--hd:${far ? 1100 : 900}ms"><h2>${r.q}</h2><p id="hint">${r.hint}</p></div>
    <div class="field" id="field"></div><div class="held" id="held"></div>
    <button class="next" id="next">Continue</button>`;
  const field = document.getElementById('field');
  words = r.words.map((w, i) => {
    const slot = document.createElement('div'); slot.className = 'slot';
    slot.innerHTML = `<div class="drift"><button class="word${far ? ' unseen' : ''}" aria-pressed="false" style="--d:${1300 + i * 110}ms"><span class="glass"><span>${w}</span></span></button></div>`;
    field.append(slot);
    const el = slot.querySelector('.word');
    return { w, i, slot, el, state: 'free', home: null, pos: { x: 0, y: 0 }, t0: 0 };
  });
  const pos = layout(r.words.length, ri);
  words.forEach((o, i) => { o.home = pos[i]; o.pos = 'a' in pos[i] ? orbitPos(pos[i]) : { ...pos[i] }; place(o); });
  words.forEach((o) => { o.el.onclick = (e) => { if (o.dragged) { o.dragged = false; return; } choose(o); }; if (ri === 0 && dragOn && !still) carry(o); });
  document.getElementById('next').onclick = () => seal(ri);
  if (far) revealFar(words);
  update();
}
function place(o, dx = 0, dy = 0, s = 1) { o.slot.style.transform = `translate(${o.pos.x + dx}px, ${o.pos.y + dy}px) scale(${s})`; }

function update() {
  const r = ROUNDS[round], list = answers[r.key];
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = list.length === 0 ? r.hint : `${list.length} of ${MAX}. Touch one again to change your mind.`;
  const next = document.getElementById('next');
  next.classList.toggle('ready', list.length > 0 && !locked); next.classList.toggle('full', list.length >= MAX);
  words.forEach((o) => {
    const on = list.includes(o.w);
    o.el.setAttribute('aria-pressed', on);
    o.el.classList.toggle('dim', !on && list.length >= MAX);
  });
  log();
}

function choose(o) {
  if (locked) return;
  const r = ROUNDS[round], list = answers[r.key];
  const on = list.includes(o.w);
  if (!on && list.length >= MAX) { o.el.classList.add('refused'); setTimeout(() => o.el.classList.remove('refused'), 430); return; }
  if (on) list.splice(list.indexOf(o.w), 1); else list.push(o.w);
  list.sort((a, b) => r.words.indexOf(a) - r.words.indexOf(b));       // vocabulary order: no ranking
  if (round === 0) { if (on) lift(o); else fall(o); }
  else { if (on) unwind(o); else reach(o); }
  update();
}

/* ------------------------------------------- round 1: they fall into her */
// A word lets go of its orbit and falls in along a curve, slowly at first,
// then faster, the way anything does when it gives in to a pull.
function fall(o, quick) {
  o.state = 'falling'; o.t0 = performance.now(); o.dur = T(quick ? 700 : 1500);
  o.from = { ...o.pos };
  const dx = o.pos.x - self.x, dy = o.pos.y - self.y;
  o.r0 = Math.hypot(dx, dy); o.a0 = Math.atan2(dy, dx);
  o.el.classList.remove('dragging'); o.el.classList.add('falling');
  self.pulls.set(o.w, { a: o.a0, t0: o.t0, amt: 0 });
}
function lift(o) {
  // let go: it leaves her the way it came and finds its orbit again
  o.state = 'lifting'; o.t0 = performance.now(); o.dur = T(1300);
  o.el.classList.remove('inside'); o.el.classList.add('lifting');
  renderHeld();
}
function stepRound1(now, dt) {
  for (const o of words) {
    if (o.state === 'free' && o.home && 'a' in o.home && !still && !o.drag) {
      o.home.a += dt * 0.012;                    // a very slow orbit: alive, never a moving target
      o.pos = orbitPos(o.home); place(o);
    }
    if (o.state === 'falling') {
      const t = clamp01((now - o.t0) / o.dur);
      const g = Math.pow(t, 1.9);               // gathering speed
      const r = lerp(o.r0, self.R * 0.25, g);
      const a = o.a0 + 0.95 * g;                  // the curve of an orbit giving way
      o.pos = { x: self.x + Math.cos(a) * r, y: self.y + Math.sin(a) * r };
      const s = lerp(1, 0.32, Math.pow(t, 1.4));
      place(o, 0, 0, s);
      const wr = wordR() * s;
      o.el.style.opacity = r < self.R + wr * 0.2 ? clamp01((r - self.R * 0.25) / (self.R * 0.75 + wr * 0.2)) : 1;
      const p = self.pulls.get(o.w); if (p) { p.a = a; p.amt = Math.sin(t * Math.PI) * 0.9; }
      if (!o.touched && r < self.R + wr * 0.85) {
        o.touched = true;
        self.ripples.push({ a, t0: now });
      }
      if (t >= 1) {
        o.state = 'inside'; o.touched = false; o.el.classList.remove('falling'); o.el.classList.add('inside'); o.el.style.opacity = '';
        self.pulls.delete(o.w);
        self.fillTo = answers.soughtFor.length / MAX;
        renderHeld();
      }
    } else if (o.state === 'lifting') {
      const t = clamp01((now - o.t0) / o.dur);
      const e = easeOut(t);
      const home = 'a' in o.home ? orbitPos(o.home) : o.home;
      const ha = Math.atan2(home.y - self.y, home.x - self.x), hr = Math.hypot(home.x - self.x, home.y - self.y);
      const r = lerp(self.R * 0.3, hr, e), a = ha - 0.95 * (1 - e);
      o.pos = { x: self.x + Math.cos(a) * r, y: self.y + Math.sin(a) * r };
      place(o, 0, 0, lerp(0.32, 1, e));
      o.el.style.opacity = clamp01(t * 2.2);
      if (t >= 1) { o.state = 'free'; o.el.classList.remove('lifting'); o.el.style.opacity = ''; self.fillTo = answers.soughtFor.length / MAX; }
    }
  }
}

// Carry (optional): pick a word up and bring it to her. The tap does the same.
function carry(o) {
  o.el.addEventListener('pointerdown', (e) => {
    if (locked || o.state !== 'free' || round !== 0) return;
    const sx = e.clientX, sy = e.clientY, start = { ...o.pos };
    let moved = false;
    const move = (ev) => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 8) return;
      if (!moved) {
        if (answers.soughtFor.length >= MAX) { o.el.classList.add('refused'); setTimeout(() => o.el.classList.remove('refused'), 430); end(); return; }
        moved = true; o.drag = true; o.el.classList.add('dragging');
      }
      o.pos = { x: start.x + dx, y: start.y + dy }; place(o);
      self.near = clamp01(1 - (Math.hypot(o.pos.x - self.x, o.pos.y - self.y) - self.R) / (self.R * 2.2));
    };
    const end = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    };
    const up = () => {
      end(); self.near = 0;
      if (!moved) return;
      o.dragged = true; o.drag = false;
      const d = Math.hypot(o.pos.x - self.x, o.pos.y - self.y);
      if (d < self.R + wordR() * 1.1) {
        // close enough: she takes it from here
        answers.soughtFor.push(o.w); answers.soughtFor.sort((a, b) => ROUNDS[0].words.indexOf(a) - ROUNDS[0].words.indexOf(b));
        fall(o, true); update();
      } else {
        // not close enough: it drifts back to its orbit
        o.el.classList.remove('dragging'); o.state = 'lifting'; o.t0 = performance.now(); o.dur = T(700);
        o.backFrom = { ...o.pos };
        o.state = 'returning';
      }
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}
function stepReturning(now) {
  for (const o of words) if (o.state === 'returning') {
    const t = clamp01((now - o.t0) / o.dur), e = easeOut(t);
    const home = 'a' in o.home ? orbitPos(o.home) : o.home;
    o.pos = { x: lerp(o.backFrom.x, home.x, e), y: lerp(o.backFrom.y, home.y, e) }; place(o);
    if (t >= 1) o.state = 'free';
  }
}

// the words she holds, written inside her; touch one to let it go
function renderHeld() {
  const held = document.getElementById('held'); if (!held) return;
  held.style.left = self.x + 'px'; held.style.top = self.y + 'px';
  const inside = words.filter((o) => o.state === 'inside').map((o) => o.w)
    .sort((a, b) => ROUNDS[0].words.indexOf(a) - ROUNDS[0].words.indexOf(b));
  const had = new Set([...held.querySelectorAll('button')].map((b) => b.dataset.w));
  held.innerHTML = inside.map((w) => `<button data-w="${w}" aria-label="Let ${w} go" style="${had.has(w) ? 'animation:none' : ''}">${w}</button>`).join('');
  held.querySelectorAll('button').forEach((b) => b.onclick = () => { const o = words.find((x) => x.w === b.dataset.w); if (o) choose(o); });
}

/* -------------------------------------- round 2: her light goes out to them */
// Part of her leaves her and crosses the dark on a curve (the way matter
// streams from one star to its companion), then settles around the word as a
// ring. Nothing stays drawn between them: once it arrives, it simply belongs.
const rings = new Map();   // word → { o, motes: [], t0 }
const RING_TILT = -0.32;
function ringGeom(o) {
  const wr = wordR();
  const k = isPhone() ? 1.16 : 1.3;
  return { cx: o.pos.x, cy: o.pos.y, rx: wr * k, ry: wr * k * 0.3 };
}
function reach(o) {
  o.state = 'ringed';
  const now = performance.now();
  const g = ringGeom(o);
  const toward = Math.atan2(g.cy - self.y, g.cx - self.x);
  const n = isPhone() ? 64 : 90;
  const motes = Array.from({ length: n }, (_, k) => ({
    phase: 'flow', t0: now + (still ? 0 : (k / n) * 820 + Math.random() * 120), dur: T(1150 + Math.random() * 450),
    a0: toward + (Math.random() - 0.5) * 0.7,            // where on her it leaves from
    phi: Math.random() * Math.PI * 2,                    // where on the ring it settles
    w: 0.42 + Math.random() * 0.22, j: 0.92 + Math.random() * 0.16, size: 5 + Math.random() * 6, bend: 0.18 + Math.random() * 0.1,
  }));
  rings.set(o.w, { o, motes, t0: now, formed: 0 });
  self.pulls.set(o.w, { a: toward, t0: now, amt: 0, out: true });
  setTimeout(() => { if (o.state === 'ringed') o.el.classList.add('ringed'); }, T(1400));
}
function unwind(o) {
  o.state = 'free'; o.el.classList.remove('ringed');
  const rg = rings.get(o.w); if (!rg) return;
  const now = performance.now();
  rg.motes.forEach((m, k) => { m.phase = 'home'; m.t0 = now + (still ? 0 : Math.random() * 520); m.dur = T(1000 + Math.random() * 400); m.from = null; });
  rg.leaving = true;
}
function ringPoint(g, phi, j) {
  const x = Math.cos(phi) * g.rx * j, y = Math.sin(phi) * g.ry * j;
  return { x: g.cx + x * Math.cos(RING_TILT) - y * Math.sin(RING_TILT), y: g.cy + x * Math.sin(RING_TILT) + y * Math.cos(RING_TILT), near: Math.sin(phi) > 0 };
}
function curve(s, e, bend, u) {
  // a quadratic arc, always bending the same way round: one sky, one spin
  const mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2, dx = e.x - s.x, dy = e.y - s.y;
  const cx = mx - dy * bend, cy = my + dx * bend;
  const v = 1 - u;
  return { x: v * v * s.x + 2 * v * u * cx + u * u * e.x, y: v * v * s.y + 2 * v * u * cy + u * u * e.y };
}
function drawRings(now, dt) {
  bx.globalCompositeOperation = 'lighter'; fx.globalCompositeOperation = 'lighter';
  for (const [w, rg] of rings) {
    const g = ringGeom(rg.o);
    let settled = 0, alive = 0;
    for (const m of rg.motes) {
      if (m.phase === 'ring') m.phi += dt * m.w;
      if (now < m.t0) { if (m.phase !== 'home') { alive++; continue; } }
      const surf = (a) => ({ x: self.x + Math.cos(a) * self.R * 0.98, y: self.y + Math.sin(a) * self.R * 0.98 });
      if (m.phase === 'flow') {
        alive++;
        const u = easeIO(clamp01((now - m.t0) / m.dur));
        const p = curve(surf(m.a0), ringPoint(g, m.phi, m.j), m.bend, u);
        dot(bx, p.x, p.y, m.size * (0.7 + Math.sin(u * Math.PI) * 0.5), 0.55 + 0.35 * Math.sin(u * Math.PI));
        if (u >= 1) m.phase = 'ring';
      } else if (m.phase === 'ring') {
        alive++; settled++;
        const p = ringPoint(g, m.phi, m.j);
        const ctx = p.near ? fx : bx;
        dot(ctx, p.x, p.y, m.size * 0.62, p.near ? 0.85 : 0.4);
      } else if (m.phase === 'home') {
        if (now < m.t0) { const p = ringPoint(g, m.phi, m.j); m.phi += dt * m.w; dot(p.near ? fx : bx, p.x, p.y, m.size * 0.62, p.near ? 0.85 : 0.4); alive++; continue; }
        if (!m.from) m.from = ringPoint(g, m.phi, m.j);
        const u = easeIO(clamp01((now - m.t0) / m.dur));
        if (u < 1) { alive++; const p = curve(m.from, surf(m.a0), -m.bend, u); dot(bx, p.x, p.y, m.size * (0.8 - u * 0.3), 0.7 * (1 - u * 0.5)); }
        else if (!m.absorbed) { m.absorbed = true; }
      }
    }
    // the ring itself, once enough of her has arrived: a hairline of her light
    rg.formed = lerp(rg.formed, rg.leaving ? 0 : settled / rg.motes.length, 0.06);
    if (rg.formed > 0.02) {
      for (const [ctx, a0, a1, k] of [[bx, Math.PI, Math.PI * 2, 0.22], [fx, 0, Math.PI, 0.45]]) {
        ctx.globalAlpha = rg.formed * k; ctx.strokeStyle = rgba(WARM, 1); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(g.cx, g.cy, g.rx, g.ry, RING_TILT, a0, a1); ctx.stroke();
      }
    }
    if (rg.leaving && alive === 0) { rings.delete(w); self.ripples.push({ a: Math.atan2(g.cy - self.y, g.cx - self.x), t0: now, soft: true }); }
    const p = self.pulls.get(w);
    if (p && p.out) { const age = now - p.t0; p.amt = still ? 0 : age < 1600 ? Math.sin(clamp01(age / 1600) * Math.PI) * 0.8 + 0.25 * clamp01(age / 800) : 0.25; if (rg.leaving) self.pulls.delete(w); }
  }
  bx.globalAlpha = 1; fx.globalAlpha = 1; bx.globalCompositeOperation = 'source-over'; fx.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------------------------- draw her */
function drawSelf(now) {
  const breath = still ? 0 : Math.sin(now / 1600) * 0.012;
  const R = self.R * easeOut(self.born) * (1 + breath + self.kindle * 0.03);
  if (R < 0.5) return;
  const { x, y } = self;
  self.fill = lerp(self.fill, self.fillTo, 0.035);
  const f = self.fill, k = self.kindle, near = self.near || 0, fi = f * CLEAR;
  // her outline leans, very slightly, toward whatever is pulling on her
  const N = 120, path = new Path2D();
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    let r = 1;
    for (const p of self.pulls.values()) r += p.amt * 0.075 * Math.exp(6 * (Math.cos(a - p.a) - 1));
    const px = x + Math.cos(a) * R * r, py = y + Math.sin(a) * R * r;
    i ? path.lineTo(px, py) : path.moveTo(px, py);
  }
  path.closePath();
  const ctx = bx;
  // 1 · the light she gives off into the liquid: faint as a bubble, warm once full
  ctx.globalCompositeOperation = 'lighter';
  const haloR = R * (2.1 + f * 0.6 + k * 0.5);
  const h = ctx.createRadialGradient(x, y, R * 0.8, x, y, haloR);
  h.addColorStop(0, rgba(LIGHT, 0.05 + f * 0.13 + k * 0.08 + near * 0.08)); h.addColorStop(1, rgba(LIGHT, 0));
  ctx.fillStyle = h; ctx.beginPath(); ctx.arc(x, y, haloR, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // 2 · her body: a bubble's skin first (the edge holds the colour), filling
  //     with light from the centre out as what others come to her for arrives
  ctx.save(); ctx.clip(path);
  const body = ctx.createRadialGradient(x - R * 0.18, y - R * 0.22, 0, x, y, R * 1.02);
  // her centre stays her own colour, so what is written there stays legible;
  // the light gathers toward her skin, the way it does in a lit bubble
  body.addColorStop(0, rgba(SEED_DEEP, 0.04 + fi * 0.34));
  body.addColorStop(0.5, rgba(LIGHT, 0.05 + fi * 0.24));
  body.addColorStop(0.84, rgba(LIGHT, 0.14 + fi * 0.3));
  body.addColorStop(1, rgba(WARM, 0.4 + f * 0.2));
  ctx.fillStyle = body; ctx.fillRect(x - R * 1.2, y - R * 1.2, R * 2.4, R * 2.4);
  // the light inside her moves: three slow currents, stronger as she fills
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const t = now / 1000 * (0.11 + i * 0.03) + i * 2.1;
    const cx = x + Math.cos(t) * R * 0.62, cy = y + Math.sin(t * 1.3) * R * 0.58;
    const c = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.6);
    c.addColorStop(0, rgba(WARM, (0.03 + fi * 0.14) * (still ? 0.7 : 1))); c.addColorStop(1, rgba(WARM, 0));
    ctx.fillStyle = c; ctx.fillRect(x - R, y - R, R * 2, R * 2);
  }
  // where a word met her skin, a ring spreads across her
  self.ripples = self.ripples.filter((rp) => now - rp.t0 < 1500);
  for (const rp of self.ripples) {
    const t = (now - rp.t0) / 1500;
    const ox = x + Math.cos(rp.a) * R, oy = y + Math.sin(rp.a) * R;
    ctx.globalAlpha = (1 - t) * (rp.soft ? 0.35 : 0.6);
    ctx.strokeStyle = rgba(WARM, 1); ctx.lineWidth = 1.5 * (1 - t) + 0.5;
    ctx.beginPath(); ctx.arc(ox, oy, R * 2.1 * easeOut(t), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  // 3 · her skin: one lit hairline, and the soft glow a bubble catches
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(LIGHT, 0.55 + near * 0.3 + k * 0.2); ctx.lineWidth = 1.1; ctx.stroke(path);
  const hl = ctx.createRadialGradient(x - R * 0.42, y - R * 0.48, 0, x - R * 0.42, y - R * 0.48, R * 0.5);
  hl.addColorStop(0, 'rgba(255,250,240,0.32)'); hl.addColorStop(1, 'rgba(255,250,240,0)');
  ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(x - R * 0.42, y - R * 0.48, R * 0.5, 0, Math.PI * 2); ctx.fill();
  // no inner highlight arc: Robin, 2026-10-06, keep the bubble clean
  ctx.globalCompositeOperation = 'source-over';
}

// the first light she gives, crossing the dark once
let wave = null;
function drawWave(now) {
  if (!wave) return;
  const t = clamp01((now - wave.t0) / wave.dur);
  const r = lerp(self.R, wave.max, easeOut(t));
  const ctx = bx;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(self.x, self.y, Math.max(0, r - 90), self.x, self.y, r);
  g.addColorStop(0, rgba(LIGHT, 0)); g.addColorStop(0.75, rgba(LIGHT, 0.09 * (1 - t))); g.addColorStop(1, rgba(LIGHT, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(self.x, self.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  for (const o of wave.words) if (!o.found && Math.hypot(o.pos.x - self.x, o.pos.y - self.y) < r + wordR() * 0.4) {
    o.found = true; o.el.classList.remove('unseen'); o.el.classList.add('found');
  }
  if (t >= 1) { for (const o of wave.words) if (!o.found) { o.found = true; o.el.classList.remove('unseen'); o.el.classList.add('found'); } wave = null; }
}
function revealFar(ws) {
  wave = { t0: performance.now() + T(300), dur: T(2600), max: Math.hypot(innerWidth, innerHeight) * 0.62, words: ws };
}

/* ------------------------------------------------------------ the turns */
function seal(ri) {
  locked = true;
  stage.querySelector('.head').classList.add('out');
  document.getElementById('next').classList.remove('ready');
  const held = document.getElementById('held');
  if (ri === 0) {
    // THE TURN: what wasn't taken drifts off; she is whole, and kindles once
    words.forEach((o) => { if (o.state === 'free') o.el.classList.add('leaving'); });
    if (held) held.classList.add('locked');
    setTimeout(() => {
      self.fillTo = Math.max(self.fill, 0.82);
      kindle(performance.now());
    }, T(500));
    setTimeout(() => {
      const keep = held ? held.outerHTML : '';
      startRound(1, true);
      // she is the same object: the words inside her stay written there
      const h = document.getElementById('held'); if (h && keep) { h.outerHTML = keep; }
      const nh = document.getElementById('held'); if (nh) { nh.classList.add('locked'); nh.querySelectorAll('button').forEach((b) => b.style.animation = 'none'); }
    }, T(1500));
  } else {
    // THE END: her world. What draws her turns with her, at its distance.
    words.forEach((o) => { if (o.state !== 'ringed') o.el.classList.add('leaving'); });
    if (held) held.classList.add('locked');
    const ringed = words.filter((o) => o.state === 'ringed');
    const t0 = performance.now();
    ringed.forEach((o) => { o.endFrom = { ...o.pos }; o.endA = Math.atan2(o.pos.y - self.y, o.pos.x - self.x); o.endR = Math.hypot(o.pos.x - self.x, o.pos.y - self.y); });
    endTurn = { t0, ringed };
    setTimeout(() => {
      const end = document.createElement('div'); end.className = 'head'; end.style.top = isPhone() ? '74%' : '84%';
      end.innerHTML = `<p style="margin:0">Sought for ${answers.soughtFor.join(', ').toLowerCase() || '…'}. Drawn toward ${answers.drawnToward.join(', ').toLowerCase() || '…'}.<br>(prototype ends here; the camera rises to H6)</p>`;
      stage.append(end);
    }, T(2200));
  }
}
let endTurn = null;
function stepEnd(now) {
  if (!endTurn || still) return;
  const t = clamp01((now - endTurn.t0) / 6000), e = easeIO(t);
  for (const o of endTurn.ringed) {
    // a phone has no room to swing them round her: they turn by a hair
    const a = o.endA + (isPhone() ? 0.1 : 0.3) * e;
    o.pos = { x: self.x + Math.cos(a) * o.endR, y: self.y + Math.sin(a) * o.endR }; place(o);
  }
}
function kindle(t0) { self.kindleT0 = t0; }

/* ------------------------------------------------------------- the loop */
let last = performance.now(), bornT0 = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (bornT0) self.born = clamp01((now - bornT0) / T(1600));
  if (self.kindleT0) { const t = (now - self.kindleT0) / T(1800); self.kindle = t < 1 ? Math.sin(clamp01(t) * Math.PI) : 0; if (t >= 1) self.kindleT0 = 0; }
  bx.clearRect(0, 0, innerWidth, innerHeight); fx.clearRect(0, 0, innerWidth, innerHeight);
  if (round === 0) stepRound1(now, dt);
  stepReturning(now);
  stepEnd(now);
  drawWave(now);
  drawSelf(now);
  drawRings(now, dt);
  requestAnimationFrame(frame);
}

function boot() {
  sizeCanvases(); placeSelf();
  // her birth: the seed she chose at H2 opens into a bubble of her colour
  bornT0 = performance.now() + T(250);
  startRound(0, false);
  log();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  sizeCanvases(); placeSelf();
  const pos = layout(words.length, round);
  words.forEach((o, i) => { o.home = pos[i]; if (o.state === 'free' || o.state === 'ringed') { o.pos = 'a' in pos[i] ? orbitPos(pos[i]) : { ...pos[i] }; place(o); } });
  renderHeldPos();
});
function renderHeldPos() { const h = document.getElementById('held'); if (h) { h.style.left = self.x + 'px'; h.style.top = self.y + 'px'; } }
document.fonts.ready.then(boot);
</script>
</body>
