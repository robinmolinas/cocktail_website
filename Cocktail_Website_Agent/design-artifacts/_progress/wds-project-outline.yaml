  primary:
    profile: "Curious Esthete & Self-Explorer"
    drivers: "Mixology excitement (cocktail art/physics) + personality reflection (narrative justification by Historian/Mixologist agents)"
    frustrations: "Generic, arbitrary, long quizzes lacking narrative depth"
  secondary:
    profile: "Creative Peers, Leads, & Recruiters evaluating Robin's portfolio"
    needs: "Experiencing the quiz as a primary user, evaluating layout, performance, and animation quality"
product_concept:
  name: "Distillation of the Unseen Self (The Cocktail Within You)"
  description: "A native-video personality journey with glass spheres, dark photographic reading rooms, fixed authored recipes and a printable keepsake."
success_criteria:
  performance: "Smooth UI motion on desktop and phone; native 1x source video, reduced-motion alternatives"
  transition_time: "Approved per-hold choreography; no blanket four-second ceiling"
  engagement: "Original >80% completion aspiration; no measured result claimed"
  output_value: "Original >40% save aspiration; clean two-sheet print; print opening is not a confirmed save"
competitive_moats:
  moat_1: "Authored Meaning: sourced cocktail history and a personal reading grounded in the offline Pour Studio."
  moat_2: "Ordered 12x11 Matrix: auditable matching across 132 distinct pairings; not a psychological assessment."
  moat_3: "Mixology Authority: Authentically designed around Robin's real-world expertise in syrups, infusions, and craft cocktail preparation."
constraints:
  timeline: "Flexible (portfolio showcase, quality-first, personal timeline)"
  budget: "Personal, non-commercial budget bounds"
  brand: "Mystical, sophisticated, theatrical, intimate; dark photographic world, light and lettering, container-free UI"
  technical: "Native video and custom Canvas effects; fixed recipes, browser-only trace/diagnostics, gesture-gated non-blocking audio seam"
platform_strategy:
  architecture: "Responsive Web Application (React + Vite + TypeScript)"
  device_priority: "Equal priority responsive design (Desktop cinematic layout, Mobile touch-friendly and fluid layout)"
  interaction_models: "Click/touch choices; continuous H3 mote drag; optional H5 round-1 word carry equivalent to tap; keyboard and Still Water alternatives"
  core_technologies: "React, Vite, TypeScript, Tailwind; custom Canvas effects; shared pure matching core; browser print CSS"







