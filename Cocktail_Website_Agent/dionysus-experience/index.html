<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dionysus — The Cocktail Within You</title>
    <meta name="description" content="A theatrical journey into your own subconscious, distilled into a bespoke cocktail." />

    <!-- The link card: one sealed invitation for every link. Crawlers read static
         HTML only, so per-cocktail cards wait for SSR/edge rendering at deploy;
         until then the cocktail stays a surprise behind the click - by design.
         og:image must become an absolute URL once the production domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dionysus" />
    <meta property="og:title" content="Meet the cocktail within" />
    <meta property="og:description" content="A friend crossed the threshold and was poured a cocktail of their own. Yours is waiting in the dark." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meet the cocktail within" />
    <meta name="twitter:description" content="A friend crossed the threshold and was poured a cocktail of their own. Yours is waiting in the dark." />
    <meta name="twitter:image" content="/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
